// IMPROVED Function to move material from QC inventory to final inventory
function moveToFinalInventory(qcInventoryId, targetStatus) {
    console.log(`Starting move process: ${qcInventoryId} to ${targetStatus}`);
    
    let qcItem; // Declare variable here to maintain scope
    
    return db.collection('qc_inventory').doc(qcInventoryId).get()
        .then(doc => {
            if (!doc.exists) {
                throw new Error('QC inventory item not found');
            }
            
            qcItem = doc.data();
            console.log('Moving QC item:', qcItem);
            
            // Move to appropriate final inventory based on target status
            if (targetStatus === 'approved') {
                console.log('Moving to goods inventory...');
                return moveToGoodsInventory(qcItem).then(() => logQCReceiveTransaction(qcItem));
            } else if (targetStatus === 'rejected') {
                console.log('Moving to rejection inventory...');
                return moveToRejectionInventory(qcItem);
            } else if (targetStatus === 'rework') {
                console.log('Moving to rework inventory...');
                return moveToReworkInventory(qcItem);
            } else {
                throw new Error('Invalid target status: ' + targetStatus);
            }
        })
        .then(() => {
            console.log('Final inventory updated, now updating QC record...');
            
            // Update the original QC record
            const user = localStorage.getItem('username') || localStorage.getItem('userEmail') || 'Quality Inspector';
            return db.collection('qc_records').doc(qcItem.qcRecordId).update({
                finalStatus: targetStatus,
                finalMoveDate: firebase.firestore.FieldValue.serverTimestamp(),
                finalMoveBy: user
            });
        })
        .then(() => {
            console.log('QC record updated, now removing from QC inventory...');
            
            // REMOVE from QC inventory after successful move
            return db.collection('qc_inventory').doc(qcInventoryId).delete();
        })
        .then(() => {
            console.log('Item removed from QC inventory');
            
            // Show success message based on target status
            let message = `Material successfully `;
            if (targetStatus === 'approved') {
                message += `approved and moved to main inventory for dispatch!`;
            } else if (targetStatus === 'rejected') {
                message += `moved to rejection inventory!`;
            } else if (targetStatus === 'rework') {
                message += `moved to rework inventory!`;
            }
            
            alert(message);
            loadQCInventory(); // Refresh the QC inventory list
            
            // Refresh main inventory if approved
            if (targetStatus === 'approved') {
                setTimeout(() => {
                    loadInventory(); // Refresh main inventory with a slight delay
                }, 1000);
            }
        })
        .catch(error => {
            console.error('Error in moveToFinalInventory:', error);
            alert('Error moving material: ' + error.message);
        });
}

// Record the approved FG as a RECEIVE transaction so the Store reports count it.
// Fixed document id (QCRCV-<qcId>) = same id the Store dashboard uses for back-filling,
// so a QC record can never be counted twice.
function logQCReceiveTransaction(qcItem) {
    const qcId = qcItem.qcRecordId;
    const user = localStorage.getItem('username') || localStorage.getItem('userEmail') || 'Quality Inspector';
    const qty = Number(qcItem.quantity) || 0;
    if (!qcId || !qty || !qcItem.materialId) return Promise.resolve();

    return db.collection('transactions').doc('QCRCV-' + qcId).set({
        materialId: qcItem.materialId,
        inventoryDocId: null,
        materialName: (qcItem.materialName || '').trim(),
        category: qcItem.category || 'FG',
        uom: normalizeUom(qcItem.uom),
        type: 'RECEIVE',
        quantity: qty,
        remarks: `FG received from QC ${qcId} (Job: ${qcItem.sourceJob || '-'}, Order: ${qcItem.orderId || '-'})`,
        user: user,
        source: 'QC_APPROVED',
        qcRecordId: qcId,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        date: new Date()
    }).catch(error => {
        // never block the stock move because of the log entry
        console.error('Could not record QC receive transaction:', error);
    });
}

// Move to Goods Inventory (Finished Goods)
function moveToGoodsInventory(qcItem) {
    const inventoryId = 'INV-' + Date.now();
    
    const inventoryData = {
        inventoryId: inventoryId,
        materialId: qcItem.materialId,
        materialName: qcItem.materialName,
        currentStock: qcItem.quantity,
        uom: normalizeUom(qcItem.uom),
        reorderLevel: 10,
        sizeCategory: qcItem.sizeCategory,
        dimensions: qcItem.dimensions,
        weight: qcItem.weight,
        category: qcItem.category,
        sourceJob: qcItem.sourceJob,
        orderId: qcItem.orderId,
        qcRecordId: qcItem.qcRecordId,
        addedDate: firebase.firestore.FieldValue.serverTimestamp(),
        addedBy: qcItem.addedBy,
        status: 'available',
        location: 'Main Warehouse'
    };
    
    console.log('Moving to goods inventory:', inventoryData);
    
    // Check if similar inventory item exists
    return db.collection('inventory')
        .where('materialId', '==', inventoryData.materialId)
        .where('sizeCategory', '==', inventoryData.sizeCategory)
        .where('dimensions', '==', inventoryData.dimensions)
        .where('category', '==', inventoryData.category)
        .get()
        .then(snapshot => {
            if (!snapshot.empty) {
                // Update existing inventory
                const existingItem = snapshot.docs[0];
                const existingData = existingItem.data();
                const newStock = (existingData.currentStock || 0) + (inventoryData.currentStock || 0);
                
                console.log('Updating existing inventory item:', existingItem.id, 'New stock:', newStock);
                
                return db.collection('inventory').doc(existingItem.id).update({
                    currentStock: newStock,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastQcRecord: qcItem.qcRecordId
                });
            } else {
                // Create new inventory item
                console.log('Creating new inventory item:', inventoryId);
                return db.collection('inventory').doc(inventoryId).set(inventoryData);
            }
        })
        .catch(error => {
            console.error('Error moving to goods inventory:', error);
            throw new Error('Failed to add to goods inventory: ' + error.message);
        });
}

// Function to load QC inventory for management - CORRECTED
function loadQCInventory() {
    const tbody = document.getElementById('qcInventoryBody');
    if (!tbody) {
        console.error('QC inventory table body not found');
        return;
    }
    
    tbody.innerHTML = '<tr><td colspan="10" class="text-center">Loading...</td></tr>';
    
    console.log('Loading QC inventory...');
    
    db.collection('qc_inventory')
        .orderBy('addedDate', 'desc')
        .get()
        .then(snapshot => {
            console.log('QC inventory snapshot:', snapshot.size, 'items found');
            
            tbody.innerHTML = '';
            
            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center">No items in QC inventory</td></tr>';
                updateQCStockSummary(0, 0, 0, 0);
                return;
            }
            
            let totalItems = 0;
            let qcHoldCount = 0;
            let rejectionHoldCount = 0;
            let reworkHoldCount = 0;
            let hasItems = false;
            
            snapshot.forEach(doc => {
                const item = doc.data();
                
                // Only show items that are still in hold status
                if (item.inventoryStatus && ['qc_hold', 'rejection_hold', 'rework_hold'].includes(item.inventoryStatus)) {
                    hasItems = true;
                    totalItems++;
                    
                    if (item.inventoryStatus === 'qc_hold') qcHoldCount++;
                    if (item.inventoryStatus === 'rejection_hold') rejectionHoldCount++;
                    if (item.inventoryStatus === 'rework_hold') reworkHoldCount++;
                    
                    const row = document.createElement('tr');
                    
                    let actions = '';
                    if (item.inventoryStatus === 'qc_hold') {
                        actions = `
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-success" onclick="moveToFinalInventory('${doc.id}', 'approved')">
                                    <i class="fas fa-check"></i> Approve
                                </button>
                                <button class="btn btn-danger" onclick="moveToFinalInventory('${doc.id}', 'rejected')">
                                    <i class="fas fa-times"></i> Reject
                                </button>
                                <button class="btn btn-warning" onclick="moveToFinalInventory('${doc.id}', 'rework')">
                                    <i class="fas fa-redo"></i> Rework
                                </button>
                            </div>
                        `;
                    } else if (item.inventoryStatus === 'rejection_hold') {
                        actions = `
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-success" onclick="moveToFinalInventory('${doc.id}', 'approved')">
                                    <i class="fas fa-check"></i> Approve
                                </button>
                                <button class="btn btn-danger" onclick="moveToFinalInventory('${doc.id}', 'rejected')">
                                    <i class="fas fa-times"></i> Confirm Reject
                                </button>
                            </div>
                        `;
                    } else if (item.inventoryStatus === 'rework_hold') {
                        actions = `
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-success" onclick="moveToFinalInventory('${doc.id}', 'approved')">
                                    <i class="fas fa-check"></i> Approve
                                </button>
                                <button class="btn btn-warning" onclick="moveToFinalInventory('${doc.id}', 'rework')">
                                    <i class="fas fa-redo"></i> Confirm Rework
                                </button>
                            </div>
                        `;
                    }
                    
                    row.innerHTML = `
                        <td>${item.qcInventoryId || doc.id}</td>
                        <td>${item.materialName || 'N/A'}</td>
                        <td>${item.quantity || 0} ${normalizeUom(item.uom)}</td>
                        <td>${item.sizeCategory || '-'}</td>
                        <td>${item.dimensions || '-'}</td>
                        <td>${item.weight || '-'}</td>
                        <td><span class="badge ${getStatusBadgeClass(item.qcStatus)}">${item.qcStatus || 'pending'}</span></td>
                        <td><span class="badge ${getInventoryStatusBadgeClass(item.inventoryStatus)}">${item.inventoryStatus}</span></td>
                        <td>${item.addedDate ? formatDate(item.addedDate) : 'N/A'}</td>
                        <td>${actions}</td>
                    `;
                    
                    tbody.appendChild(row);
                }
            });
            
            // Update stock summary
            updateQCStockSummary(totalItems, qcHoldCount, rejectionHoldCount, reworkHoldCount);
            
            if (!hasItems) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center">No items in QC inventory</td></tr>';
            }
        })
        .catch(error => {
            console.error('Error loading QC inventory:', error);
            tbody.innerHTML = '<tr><td colspan="10" class="text-center text-danger">Error loading QC inventory</td></tr>';
        });
}

// Function to update QC stock summary

        summaryElement = document.createElement('div');

// Helper function for status badge classes
function getStatusBadgeClass(status) {
    switch(status) {
        case 'approved': return 'bg-success';
        case 'rejected': return 'bg-danger';
        case 'rework': return 'bg-warning';
        default: return 'bg-secondary';
    }
}

// Helper function for inventory status badge classes
function getInventoryStatusBadgeClass(status) {
    switch(status) {
        case 'qc_hold': return 'bg-info';
        case 'rejection_hold': return 'bg-danger';
        case 'rework_hold': return 'bg-warning';
        default: return 'bg-secondary';
    }
}




// Date formatting function
function formatDate(timestamp) {
    if (!timestamp) return 'N/A';
    const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
}
// Helper function for inventory status badge classes
function getInventoryStatusBadgeClass(status) {
    switch(status) {
        case 'qc_hold': return 'bg-info';
        case 'rejection_hold': return 'bg-danger';
        case 'rework_hold': return 'bg-warning';
        case 'approved': return 'bg-success';
        case 'rejected': return 'bg-dark';
        case 'rework': return 'bg-warning text-dark';
        default: return 'bg-secondary';
    }
}

        // Get badge class based on category
        function getCategoryBadgeClass(category) {
            switch(category) {
                case 'FG': return 'bg-success';
                case 'RM': return 'bg-warning';
                case 'WIP': return 'bg-info';
                case 'SP': return 'bg-secondary';
                case 'SCRAP': return 'scrap-inventory-badge';
                case 'REWORK': return 'rework-inventory-badge';
                default: return 'bg-dark';
            }
        }

        // Search inventory
        function searchInventory() {
            const searchTerm = document.getElementById('inventorySearch').value.toLowerCase();
            const rows = document.getElementById('inventoryBody').getElementsByTagName('tr');
            
            for (let row of rows) {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            }
        }

        // Filter inventory by category and status
        function filterInventory() {
            const category = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;
            const rows = document.getElementById('inventoryBody').getElementsByTagName('tr');
            
            for (let row of rows) {
                if (category === '' && status === '') {
                    row.style.display = '';
                } else {
                    const rowCategory = row.cells[2]?.textContent || '';
                    const rowStatus = row.cells[8]?.textContent || '';
                    
                    const categoryMatch = category === '' || rowCategory.includes(category);
                    const statusMatch = status === '' || rowStatus.toLowerCase().includes(status.toLowerCase());
                    
                    row.style.display = categoryMatch && statusMatch ? '' : 'none';
                }
            }
        }

        // Export inventory
        function exportInventory() {
            alert('Export functionality would be implemented here');
            // This would typically generate a CSV or PDF report
        }

        // Load scrap management
        function loadScrapManagement() {
            loadScrapStats();
            loadScrapTable();
        }

        // Load scrap statistics
        function loadScrapStats() {
            const today = new Date();
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            
            // Total scrap value
            db.collection('scrap_materials').get().then(snapshot => {
                let totalValue = 0;
                snapshot.forEach(doc => {
                    const scrap = doc.data();
                    totalValue += scrap.estimatedValue || 0;
                });
                document.getElementById('totalScrapValue').textContent = '$' + totalValue.toFixed(2);
            });

            // Scrap this month
            db.collection('scrap_materials')
                .where('scrapDate', '>=', firstDayOfMonth)
                .get()
                .then(snapshot => {
                    document.getElementById('scrapThisMonth').textContent = snapshot.size;
                });

            // Pending rework
            db.collection('rework_jobs')
                .where('status', '==', 'pending')
                .get()
                .then(snapshot => {
                    document.getElementById('pendingRework').textContent = snapshot.size;
                });

            // Rework completed
            db.collection('rework_jobs')
                .where('status', '==', 'completed')
                .get()
                .then(snapshot => {
                    document.getElementById('reworkCompleted').textContent = snapshot.size;
                });
        }

        // Load scrap table
        function loadScrapTable() {
            const scrapBody = document.getElementById('scrapBody');
            scrapBody.innerHTML = '<tr><td colspan="11" class="text-center">Loading scrap data...</td></tr>';
            
            db.collection('scrap_materials')
                .orderBy('scrapDate', 'desc')
                .get()
                .then(snapshot => {
                    scrapBody.innerHTML = '';
                    
                    if (snapshot.empty) {
                        scrapBody.innerHTML = '<tr><td colspan="11" class="text-center text-muted">No scrap records found</td></tr>';
                        return;
                    }
                    
                    snapshot.forEach(doc => {
                        const scrap = doc.data();
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${scrap.scrapId}</td>
                            <td>${scrap.materialName}</td>
                            <td>${scrap.jobId}</td>
                            <td>${scrap.rejectionReason}</td>
                            <td>${scrap.quantity}</td>
                            <td>${normalizeUom(scrap.uom)}</td>
                            <td>${scrap.weight || 'N/A'}</td>
                            <td>$${(scrap.estimatedValue || 0).toFixed(2)}</td>
                            <td><span class="badge bg-info">${scrap.disposition}</span></td>
                            <td>${scrap.scrapDate?.toDate().toLocaleDateString() || '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger" onclick="disposeScrap('${doc.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        `;
                        scrapBody.appendChild(row);
                    });
                });
        }

        // Search scrap
        function searchScrap() {
            const searchTerm = document.getElementById('scrapSearch').value.toLowerCase();
            const rows = document.getElementById('scrapBody').getElementsByTagName('tr');
            
            for (let row of rows) {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            }
        }

        // Show scrap modal
        function showScrapModal() {
            const modal = new bootstrap.Modal(document.getElementById('scrapModal'));
            modal.show();
        }

        // Add scrap manually
        function addScrapManually() {
            const material = document.getElementById('scrapMaterial').value;
            const quantity = document.getElementById('scrapQuantity').value;
            const uom = document.getElementById('scrapUOM').value;
            const reason = document.getElementById('scrapReason').value;
            const value = document.getElementById('scrapValue').value;
            const notes = document.getElementById('scrapNotes').value;
            
            if (!material || !quantity || !uom || !reason) {
                alert('Please fill all required fields');
                return;
            }
            
            const scrapId = 'SCRAP-MANUAL-' + Date.now();
            const user = localStorage.getItem('username') || localStorage.getItem('userEmail') || 'Quality Inspector';
            
            const scrapData = {
                scrapId: scrapId,
                materialName: material,
                quantity: parseFloat(quantity),
                uom: uom,
                rejectionReason: reason,
                estimatedValue: parseFloat(value) || 0,
                notes: notes,
                disposition: 'scrap',
                inspector: user,
                scrapDate: firebase.firestore.FieldValue.serverTimestamp(),
                status: 'manual_entry'
            };
            
            db.collection('scrap_materials').doc(scrapId).set(scrapData)
                .then(() => {
                    alert('Scrap material added successfully!');
                    document.getElementById('scrapForm').reset();
                    bootstrap.Modal.getInstance(document.getElementById('scrapModal')).hide();
                    loadScrapManagement();
                })
                .catch(error => {
                    alert('Error adding scrap: ' + error.message);
                });
        }

        // Dispose scrap
        function disposeScrap(scrapId) {
            if (confirm('Are you sure you want to mark this scrap as disposed?')) {
                db.collection('scrap_materials').doc(scrapId).update({
                    status: 'disposed',
                    disposedDate: firebase.firestore.FieldValue.serverTimestamp()
                })
                .then(() => {
                    alert('Scrap marked as disposed');
                    loadScrapManagement();
                })
                .catch(error => {
                    alert('Error disposing scrap: ' + error.message);
                });
            }
        }

        // Load quality reports
        function loadQualityReports() {
            loadQualityChart();
            loadDailySummary();
            loadRejectionAnalysis();
        }

        // Load quality chart
        function loadQualityChart() {
            db.collection('qc_records').get().then(snapshot => {
                const statusCount = {
                    approved: 0,
                    rejected: 0,
                    rework: 0
                };
                
                snapshot.forEach(doc => {
                    const qc = doc.data();
                    statusCount[qc.status]++;
                });
                
                const ctx = document.getElementById('qualityChart').getContext('2d');
                
                if (qualityChart) {
                    qualityChart.destroy();
                }
                
                qualityChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Approved', 'Rejected', 'Rework'],
                        datasets: [{
                            data: [statusCount.approved, statusCount.rejected, statusCount.rework],
                            backgroundColor: [
                                '#27ae60',
                                '#e74c3c',
                                '#f39c12'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            });
        }

        // Load daily summary
        function loadDailySummary() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            db.collection('qc_records')
                .where('qcDate', '>=', today)
                .where('qcDate', '<', tomorrow)
                .get()
                .then(snapshot => {
                    const dailySummary = document.getElementById('dailySummary');
                    const statusCount = {
                        approved: 0,
                        rejected: 0,
                        rework: 0
                    };
                    
                    snapshot.forEach(doc => {
                        const qc = doc.data();
                        statusCount[qc.status]++;
                    });
                    
                    dailySummary.innerHTML = `
                        <div class="text-center">
                            <h4>Today's QC Summary</h4>
                            <div class="row mt-4">
                                <div class="col-4">
                                    <div class="text-success">
                                        <h3>${statusCount.approved}</h3>
                                        <small>Approved</small>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="text-danger">
                                        <h3>${statusCount.rejected}</h3>
                                        <small>Rejected</small>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="text-warning">
                                        <h3>${statusCount.rework}</h3>
                                        <small>Rework</small>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-4">
                                <small class="text-muted">Total Inspections: ${snapshot.size}</small>
                            </div>
                        </div>
                    `;
                });
        }

        // Load rejection analysis
        function loadRejectionAnalysis() {
            db.collection('qc_records')
                .where('status', '==', 'rejected')
                .get()
                .then(snapshot => {
                    const rejectionAnalysis = document.getElementById('rejectionAnalysis');
                    
                    if (snapshot.empty) {
                        rejectionAnalysis.innerHTML = '<div class="text-center text-muted">No rejection data available</div>';
                        return;
                    }
                    
                    let analysis = '<div class="table-responsive"><table class="table table-sm"><thead><tr><th>Material</th><th>FG Product</th><th>Reason</th><th>Disposition</th><th>Machine</th><th>Rejection Count</th><th>Last Rejection</th></tr></thead><tbody>';
                    
                    const materialRejections = {};
                    
                    snapshot.forEach(doc => {
                        const qc = doc.data();
                        const key = `${qc.materialName}-${qc.fgProductName}-${qc.rejectionReason}-${qc.disposition}-${qc.machine}`;
                        if (!materialRejections[key]) {
                            materialRejections[key] = {
                                material: qc.materialName,
                                fgProduct: qc.fgProductName,
                                reason: qc.rejectionReason,
                                disposition: qc.disposition,
                                machine: qc.machine,
                                count: 0,
                                lastDate: qc.qcDate
                            };
                        }
                        materialRejections[key].count++;
                        if (qc.qcDate > materialRejections[key].lastDate) {
                            materialRejections[key].lastDate = qc.qcDate;
                        }
                    });
                    
                    Object.keys(materialRejections).forEach(key => {
                        const data = materialRejections[key];
                        analysis += `<tr>
                            <td>${data.material}</td>
                            <td>${data.fgProduct}</td>
                            <td>${data.reason}</td>
                            <td><span class="badge bg-info">${data.disposition}</span></td>
                            <td>${data.machine}</td>
                            <td>${data.count}</td>
                            <td>${data.lastDate?.toDate().toLocaleDateString() || '-'}</td>
                        </tr>`;
                    });
                    
                    analysis += '</tbody></table></div>';
                    rejectionAnalysis.innerHTML = analysis;
                });
        }

        // Handle logout
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('userRole');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('username');
                (window.top || window).location.href = 'index.html';
            }
        }
    \u003c/script>
</body>
</html>
</script>

<script>
// ============================================================
// PLANT ERP SHELL  -  one login check, one place for roles
// ============================================================
// Login (index.html) stores userRole. Role -> modules this person can open.
var APPS = {
    store: { role: 'data-entry', title: 'Store', icon: 'fa-warehouse' },
    planner: { role: 'planner', title: 'Planner', icon: 'fa-calendar-check' },
    production: { role: 'production', title: 'Production', icon: 'fa-industry' },
    quality: { role: 'quality', title: 'Quality', icon: 'fa-clipboard-check' }
};
var ALL = ['store', 'planner', 'production', 'quality'];
var ROLE_MODULES = {
    'data-entry': ['store'],
    'planner': ['planner'],
    'production': ['production'],
    'quality': ['quality'],
    'admin': ALL,
    'all': ALL
};
var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAsd4D5WjW7yYaZqOfjcG3fkkpDo4ZBFek",
    authDomain: "ofc-erp-847bf.firebaseapp.com",
    projectId: "ofc-erp-847bf",
    storageBucket: "ofc-erp-847bf.firebasestorage.app",
    messagingSenderId: "752585152607",
    appId: "1:752585152607:web:915ae9a4ed01027b95e3ea",
    measurementId: "G-BKX66MNYHF"
};

(function () {
    var role = localStorage.getItem('userRole');
    var email = localStorage.getItem('userEmail') || '';
    var allowed = ROLE_MODULES[role];
    if (!allowed) { window.location.href = 'index.html'; return; }

    var tabsEl = document.getElementById('erpTabs');
    var framesEl = document.getElementById('erpFrames');
    var frames = {};

    function decode(key) {
        return document.getElementById('app-' + key).textContent
            .replace(/^\n/, '').replace(/\n$/, '')
            .replace(/\\u003c\/script/g, '</script')
            .replace(/\\u003c!--/g, '<!--');
    }

    function openApp(key) {
        if (!frames[key]) {
            var f = document.createElement('iframe');
            f.className = 'erp-frame';
            f.id = 'erpFrame-' + key;
            f.srcdoc = decode(key);
            framesEl.appendChild(f);
            frames[key] = f;
        }
        Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('active', k === key); });
        Array.prototype.forEach.call(tabsEl.querySelectorAll('.nav-link'), function (a) {
            a.classList.toggle('active', a.getAttribute('data-app') === key);
        });
        document.title = APPS[key].title + ' - Plant ERP';
        try { sessionStorage.setItem('erpTab', key); } catch (e) {}
    }

    if (allowed.length === 1) {
        document.body.classList.add('single');
        openApp(allowed[0]);
    } else {
        allowed.forEach(function (key) {
            var li = document.createElement('li');
            li.className = 'nav-item';
            li.innerHTML = '<a class="nav-link" href="#" data-app="' + key + '"><i class="fas ' + APPS[key].icon + ' me-1"></i>' +
                APPS[key].title + ' <span class="badge bg-danger" id="erpBadge-' + key + '" style="display:none"></span></a>';
            li.firstChild.addEventListener('click', function (e) { e.preventDefault(); openApp(key); });
            tabsEl.appendChild(li);
        });
        var last = null;
        try { last = sessionStorage.getItem('erpTab'); } catch (e) {}
        openApp(allowed.indexOf(last) !== -1 ? last : allowed[0]);
    }

    document.getElementById('erpUser').textContent = email + (role ? ' (' + role + ')' : '');
    document.getElementById('erpLogout').addEventListener('click', function () {
        var done = function () {
            localStorage.removeItem('userRole');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('username');
            window.location.href = 'index.html';
        };
        try { firebase.auth().signOut().then(done, done); } catch (e) { done(); }
    });

    // Live badge on the Store tab: material issue requests waiting for approval
    try {
        if (typeof firebase !== 'undefined' && allowed.length > 1 && allowed.indexOf('store') !== -1) {
            if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
            firebase.firestore().collection('material_issues').where('status', '==', 'pending')
                .onSnapshot(function (snap) {
                    var b = document.getElementById('erpBadge-store');
                    if (b) { b.textContent = snap.size; b.style.display = snap.size ? 'inline-block' : 'none'; }
                }, function () {});
        }
    } catch (e) { console.warn('Badge watcher not started', e); }
})();
</script>
