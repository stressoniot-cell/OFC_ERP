                    allocationsBody.innerHTML = '<tr><td colspan="9" class="text-center text-danger">Error loading allocations</td></tr>';
                });
        }

        // Complete allocation
        function completeAllocation(allocationId) {
            if (confirm('Mark this allocation as completed?')) {
                db.collection('allocations').doc(allocationId).update({
                    status: 'completed',
                    completedDate: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    alert('Allocation marked as completed');
                    loadAllocations();
                    loadDashboardData();
                }).catch(error => {
                    console.error('Error completing allocation:', error);
                    alert('Error completing allocation');
                });
            }
        }

        // Record transaction
        function recordTransaction(materialId, materialName, type, quantity, remarks, party) {
            const transactionId = 'TXN-' + Date.now();
            const user = localStorage.getItem('username') || localStorage.getItem('userEmail') || 'Production Planner';
            
            db.collection('transactions').doc(transactionId).set({
                transactionId: transactionId,
                materialId: materialId,
                materialName: materialName,
                type: type,
                quantity: quantity,
                party: party,
                remarks: remarks,
                user: user,
                date: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(error => {
                console.error('Error recording transaction:', error);
            });
        }

        // Handle logout
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('userRole');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('username');
                (window.top || window).location.href = 'index.html';
            }
        }

        // Load dashboard data
        function loadDashboardData() {
            loadDashboardStats();
            loadActiveJobs();
        }

        // Load dashboard statistics
        function loadDashboardStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            // Active jobs - using simpler query to avoid index issues
            db.collection('production_jobs').where('status', '==', 'in-progress').get().then(snapshot => {
                document.getElementById('activeJobs').textContent = snapshot.size;
            }).catch(error => {
                console.error('Error loading active jobs:', error);
                handleIndexError(error);
            });

            // Completed today - using client-side filtering to avoid index issues
            db.collection('production_jobs')
                .where('status', '==', 'completed')
                .get()
                .then(snapshot => {
                    let completedToday = 0;
                    snapshot.forEach(doc => {
                        const job = doc.data();
                        const completionDate = job.completionDate?.toDate();
                        if (completionDate && completionDate >= today && completionDate < tomorrow) {
                            completedToday++;
                        }
                    });
                    document.getElementById('completedToday').textContent = completedToday;
                }).catch(error => {
                    console.error('Error loading completed jobs:', error);
                    handleIndexError(error);
                });

            // Pending allocations
            db.collection('allocations').where('status', '==', 'active').get().then(snapshot => {
                document.getElementById('pendingAllocations').textContent = snapshot.size;
            }).catch(error => {
                console.error('Error loading pending allocations:', error);
                document.getElementById('pendingAllocations').textContent = '0';
            });

            // Today's scrap - using client-side filtering
            db.collection('scrap_records')
                .get()
                .then(snapshot => {
                    let totalScrap = 0;
                    snapshot.forEach(doc => {
                        const scrap = doc.data();
                        const scrapDate = scrap.date?.toDate();
                        if (scrapDate && scrapDate >= today && scrapDate < tomorrow) {
                            if (scrap.scrapType !== 'RM') totalScrap += scrap.scrapQuantity || 0;
                        }
                    });
                    document.getElementById('totalScrap').textContent = totalScrap.toFixed(1);
                }).catch(error => {
                    console.error('Error loading scrap records:', error);
                    document.getElementById('totalScrap').textContent = '0';
                });
        }

        // Load active jobs for dashboard
        function loadActiveJobs() {
            const activeJobsList = document.getElementById('activeJobsList');
            activeJobsList.innerHTML = '<div class="text-center">Loading...</div>';
            
            db.collection('production_jobs')
                .where('status', '==', 'in-progress')

                    if (snapshot.empty) {

                    jobs.forEach(job => {

                                    ${job.materialName}

                                <div class="col-md-2">
                                    ${job.customer}

                                <div class="col-md-2">
                                    <span class="badge bg-warning">In Progress</span>
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-sm btn-primary" onclick="completeJob('${job.id}')">

                                    </button>

                            <div class="row mt-2">

                                <div class="col-md-3">
                                    <small><strong>BOM:</strong> ${job.bomId || 'N/A'}</small>
                                </div>
                                <div class="col-md-3">
                                    <small><strong>FG Product:</strong> ${job.fgProductId || 'N/A'}</small>
                                </div>
                                <div class="col-md-3">
                                    <small><strong>Operator:</strong> ${job.operatorName || job.startedBy || 'N/A'}</small>

                            <div class="row mt-1">

                                    <small><strong>Planner:</strong> ${job.plannerName || job.allocatedBy || 'N/A'}</small>

        // Select machine and show allocations
        function selectMachine(machineId, machineName) {
            currentMachine = machineId;
            
            // Update UI
            document.querySelectorAll('.machine-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            document.getElementById('selectedMachineTitle').textContent = `Allocations for ${machineName}`;
            document.getElementById('machineAllocations').style.display = 'block';

        // Load allocations for selected machine - using simpler query
        function loadMachineAllocations(machineId) {
            watchAllocationIssues(machineId);
            const allocationsList = document.getElementById('allocationsList');
            allocationsList.innerHTML = '<div class="text-center">Loading allocations...</div>';
            
            // Simple query without complex ordering to avoid index issues
            db.collection('allocations')
                .where('machine', '==', machineId)
                .where('status', '==', 'active')
                .get()
                .then(snapshot => {
                    allocationsList.innerHTML = '';
                    
                    if (snapshot.empty) {
                        allocationsList.innerHTML = '<div class="text-center text-muted">No active allocations for this machine</div>';
                        return;
                    }
                    
                    // Convert to array and sort client-side
                    const allocations = [];
                    snapshot.forEach(doc => {
                        allocations.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Sort by allocatedDate descending
                    allocations.sort((a, b) => {
                        const dateA = a.allocatedDate?.toDate() || new Date(0);
                        const dateB = b.allocatedDate?.toDate() || new Date(0);
                        return dateB - dateA;
                    });
                    
                    allocations.forEach(allocation => {
                        const allocationItem = document.createElement('div');
                        allocationItem.className = 'allocation-item';
                        
                        // Use the actual field names from your data
                        allocationItem.innerHTML = `
                            <div class="row">
                                <div class="col-md-4">
                                    <strong>${allocation.fgProductName || allocation.materialName || allocation.materialId}</strong><br>
                                    <small class="text-muted">${allocation.fgProductId || allocation.materialId}</small>
                                </div>
                                <div class="col-md-3">
                                    <strong>Customer:</strong><br>
                                    ${allocation.customer}
                                </div>
                                <div class="col-md-2">
                                    <strong>Quantity:</strong><br>
                                    ${allocation.orderQuantity || allocation.quantity} ${normalizeUom(allocation.uom) || 'units'}
                                </div>
                                <div class="col-md-3 text-end">
                                    <button class="btn btn-sm btn-info me-2" onclick="viewBomDetails('${allocation.bomId}', '${allocation.id}')">
                                        <i class="fas fa-list me-1"></i>View BOM
                                    </button>
                                    ${allocationActionHtml(allocation)}
                                </div>
                            </div>
                            ${allocation.remarks ? `<div class="mt-2"><small><strong>Remarks:</strong> ${allocation.remarks}</small></div>` : ''}

        // View BOM details
        function viewBomDetails(bomId, allocationId) {
            if (!bomId) {
                alert('No BOM defined for this allocation');
                return;
            }
            
            loadBomDetails(bomId, allocationId);
        }

        // ---------- helpers ----------
        function escAttr(v) {
            return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        const SCRAP_REASON_OPTIONS = `
            <option value="">Reason</option>
            <option value="DIMENSION_ISSUE">Dimension Issue</option>
            <option value="QUALITY_DEFECT">Quality Defect</option>
            <option value="MACHINE_ERROR">Machine Error</option>
            <option value="MATERIAL_ISSUE">Material Issue</option>
            <option value="OPERATOR_ERROR">Operator Error</option>
            <option value="OTHER">Other</option>`;

        // BOM items of a job/allocation, with the quantity the Store actually issued
        function bomComponentsFallback(a) {
            if (!a.bomId) return Promise.resolve([]);
            return db.collection('boms').doc(a.bomId).get().then(b => {
                if (!b.exists) return [];
                const bom = b.data();
                const list = bom.components || bom.rawMaterials || [];
                const qty = Number(a.orderQuantity || a.allocatedQuantity) || 0;
                return list.map(c => {
                    const req = (Number(c.quantity) || 0) * qty;
                    return { materialId: c.materialId, materialName: c.materialName, requiredQty: req, issuedQty: req, uom: normalizeUom(c.uom) };
                });
            });
        }

        function getJobComponents(allocation) {
            if (allocation.issueId) {
                return db.collection('material_issues').doc(allocation.issueId).get().then(d => {
                    if (d.exists && Array.isArray(d.data().items) && d.data().items.length) {
                        return d.data().items.map(i => ({
                            materialId: i.materialId,
                            materialName: i.materialName,
                            requiredQty: Number(i.requiredQty) || 0,
                            issuedQty: i.issuedQty !== undefined ? (Number(i.issuedQty) || 0) : (Number(i.requiredQty) || 0),
                            uom: normalizeUom(i.uom)
                        }));
                    }
                    return bomComponentsFallback(allocation);
                });
            }
            if (Array.isArray(allocation.components) && allocation.components.length) {
                return Promise.resolve(allocation.components.map(i => ({
                    materialId: i.materialId, materialName: i.materialName,
                    requiredQty: Number(i.requiredQty) || 0, issuedQty: Number(i.requiredQty) || 0, uom: normalizeUom(i.uom)
                })));
            }
            return bomComponentsFallback(allocation);
        }

        // Buttons / status shown for an allocation
        function allocationActionHtml(a) {
            if (a.materialAvailable === true) {
                return `<button class="btn btn-sm btn-primary" onclick="startProduction('${a.id}')">
                            <i class="fas fa-play me-1"></i>Start Machine
                        </button>`;
            }
            if (a.issueFlow === 'store_approval') {
                if (a.issueStatus === 'requested') {
                    return `<span class="badge bg-warning text-dark"><i class="fas fa-hourglass-half me-1"></i>Waiting for Store approval</span>`;
                }
                const rej = a.issueStatus === 'rejected'
                    ? `<span class="badge bg-danger me-1" title="${escAttr(a.issueRejectReason || '')}">Store rejected</span>` : '';
                return rej + `<button class="btn btn-sm btn-warning" onclick="requestMaterialIssue('${a.id}')">
                            <i class="fas fa-paper-plane me-1"></i>${a.issueStatus === 'rejected' ? 'Re-request Issue' : 'Request Material Issue'}
                        </button>`;
            }
            // older allocations (stock was already reduced when planner allocated)
            return `<button class="btn btn-sm btn-success" onclick="markMaterialAvailable('${a.id}')">
                        <i class="fas fa-check me-1"></i>Material Available
                    </button>`;
        }

        // Refresh the list automatically when the Store approves / rejects
        let allocWatchUnsub = null;
        let allocWatchMachine = null;
        function watchAllocationIssues(machineId) {
            if (allocWatchMachine === machineId && allocWatchUnsub) return;
            if (allocWatchUnsub) allocWatchUnsub();
            allocWatchMachine = machineId;
            let first = true;
            allocWatchUnsub = db.collection('allocations')
                .where('machine', '==', machineId)
                .where('status', '==', 'active')
                .onSnapshot(() => {
                    if (first) { first = false; return; }
                    if (currentMachine === machineId) loadMachineAllocations(machineId);
                }, err => console.error('Allocation watcher error:', err));
        }

        // Load BOM details
        function loadBomDetails(bomId, allocationId) {
            Promise.all([
                db.collection('boms').doc(bomId).get(),
                db.collection('allocations').doc(allocationId).get()
            ]).then(([bomDoc, allocDoc]) => {
                if (!bomDoc.exists) {
                    alert('BOM not found: ' + bomId);
                    return;
                }
                showBomDetails(bomDoc.data(), allocationId, allocDoc.exists ? allocDoc.data() : {});
            }).catch(error => {
                console.error('Error loading BOM:', error);
                alert('Error loading BOM details');
            });
        }

        // Show BOM details in modal
        function showBomDetails(bom, allocationId, allocation) {
            allocation = allocation || {};
            const comps = bom.components || bom.rawMaterials || [];
            const orderQty = Number(allocation.orderQuantity) || 0;
            const v2 = allocation.issueFlow === 'store_approval';
            const cmap = {};
            (allocation.components || []).forEach(c => { cmap[c.materialId] = c; });

            let statusBadge = '<span class="badge bg-secondary">Not requested</span>';
            if (allocation.materialAvailable === true) statusBadge = '<span class="badge bg-success">Issued by Store</span>';
            else if (allocation.issueStatus === 'requested') statusBadge = '<span class="badge bg-warning text-dark">Waiting for Store approval</span>';
            else if (allocation.issueStatus === 'rejected') statusBadge = '<span class="badge bg-danger">Rejected by Store</span>';
            else if (!v2) statusBadge = '<span class="badge bg-warning text-dark">Not Checked</span>';

            const rows = comps.length ? comps.map(rm => {
                const c = cmap[rm.materialId];
                const required = c ? c.requiredQty : (Number(rm.quantity) || 0) * orderQty;
                const uom = normalizeUom(c ? c.uom : rm.uom);
                return `<tr>
                    <td>${escAttr(rm.materialId)}</td>
                    <td>${escAttr(rm.materialName)}</td>
                    <td>${rm.quantity}</td>
                    <td>${required}</td>
                    <td>${escAttr(uom)}</td>
                    <td>${statusBadge}</td>
                </tr>`;
            }).join('') : '<tr><td colspan="6">No materials defined</td></tr>';

            let footerAction = '';
            if (allocation.materialAvailable === true) {
                footerAction = '<span class="text-success me-auto"><i class="fas fa-check-circle me-1"></i>Materials issued by Store</span>';
            } else if (v2) {
                if (allocation.issueStatus === 'requested') {
                    footerAction = '<button type="button" class="btn btn-secondary" disabled>Waiting for Store approval</button>';
                } else {
                    footerAction = `<button type="button" class="btn btn-warning" onclick="requestMaterialIssue('${allocationId}')">
                        <i class="fas fa-paper-plane me-1"></i>${allocation.issueStatus === 'rejected' ? 'Re-request' : 'Request'} Material Issue from Store</button>`;
                }
            } else {
                footerAction = `<button type="button" class="btn btn-primary" onclick="confirmMaterialAvailability('${allocationId}')">Confirm All Materials Available</button>`;
            }

            const modalHtml = `
                <div class="modal fade" id="bomModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">BOM Details - ${escAttr(bom.bomId || 'BOM')}</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row mb-3">
                                    <div class="col-md-6"><strong>Product:</strong> ${escAttr(bom.fgProductName || bom.productName)}</div>
                                    <div class="col-md-6"><strong>Product ID:</strong> ${escAttr(bom.fgProductId || bom.productId)}</div>
                                    <div class="col-md-6 mt-2"><strong>Order Quantity:</strong> ${orderQty} ${escAttr(normalizeUom(allocation.uom))}</div>
                                </div>
                                ${allocation.issueStatus === 'rejected' && allocation.issueRejectReason ? `<div class="alert alert-danger py-2">Store rejected: ${escAttr(allocation.issueRejectReason)}</div>` : ''}
                                <h6>Raw Materials Required:</h6>
                                <div class="table-responsive">
                                    <table class="table table-sm table-bordered">
                                        <thead>
                                            <tr>
                                                <th>Material ID</th>
                                                <th>Description</th>
                                                <th>Qty / Unit</th>
                                                <th>Total Required</th>
                                                <th>UOM</th>
                                                <th>Store Status</th>
                                            </tr>
                                        </thead>
                                        <tbody id="bomMaterialsList">${rows}</tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                ${footerAction}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const existingModal = document.getElementById('bomModal');
            if (existingModal) existingModal.remove();
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            new bootstrap.Modal(document.getElementById('bomModal')).show();
        }

        // Production asks the Store to issue the BOM materials (Store approves in its dashboard)
        let issueRequestBusy = false;
        function requestMaterialIssue(allocationId) {
            if (issueRequestBusy) return;
            issueRequestBusy = true;
            const user = localStorage.getItem('username') || localStorage.getItem('userEmail') || 'Production Operator';

            db.collection('allocations').doc(allocationId).get().then(doc => {
                if (!doc.exists) { alert('Allocation not found'); return; }
                const a = doc.data();
                if (a.materialAvailable === true) { alert('Materials are already issued for this allocation'); return; }
                if (a.issueStatus === 'requested') { alert('Request is already with the Store'); return; }

                return getJobComponents(a).then(items => {
                    if (!items.length) { alert('This BOM has no materials defined'); return; }
                    const issueId = 'ISS-' + Date.now();
                    const batch = db.batch();
                    batch.set(db.collection('material_issues').doc(issueId), {
                        issueId: issueId,
                        allocationId: allocationId,
                        orderId: a.orderId || '',
                        machine: a.machine || '',
                        bomId: a.bomId || '',
                        fgProductId: a.fgProductId || '',
                        fgProductName: a.fgProductName || '',
                        customer: a.customer || '',
                        orderQuantity: a.orderQuantity || 0,
                        items: items.map(i => ({
                            materialId: i.materialId,
                            materialName: i.materialName,
                            requiredQty: i.requiredQty,
                            uom: normalizeUom(i.uom),
                            issuedQty: 0
                        })),
                        status: 'pending',
                        requestedBy: user,
                        requestedDate: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    batch.update(db.collection('allocations').doc(allocationId), {
                        issueStatus: 'requested',
                        issueId: issueId,
                        issueRequestedBy: user,
                        issueRequestedDate: firebase.firestore.FieldValue.serverTimestamp(),
                        issueRejectReason: ''
                    });
                    return batch.commit().then(() => {
                        const m = document.getElementById('bomModal');
                        if (m) { const inst = bootstrap.Modal.getInstance(m); if (inst) inst.hide(); }
                        alert('Material issue request sent to Store. You can start the machine after the Store approves it.');
                        if (currentMachine) loadMachineAllocations(currentMachine);
                    });
                });
            }).catch(error => {
                console.error('Error requesting material issue:', error);
                alert('Error sending request to Store');
            }).finally(() => { issueRequestBusy = false; });
        }

        // Confirm material availability
        function confirmMaterialAvailability(allocationId) {
            db.collection('allocations').doc(allocationId).update({
                materialAvailable: true,
                materialAvailableDate: firebase.firestore.FieldValue.serverTimestamp(),
                materialAvailableBy: localStorage.getItem('username') || 'Production Operator'
            }).then(() => {
                // Close the modal
                const modal = bootstrap.Modal.getInstance(document.getElementById('bomModal'));
                modal.hide();
                
                // Refresh allocations list
                if (currentMachine) {
                    loadMachineAllocations(currentMachine);
                }
                
                alert('Materials confirmed as available at machine area');
            }).catch(error => {
                console.error('Error confirming material availability:', error);
                alert('Error confirming material availability');
            });
        }

        // Mark material as available (moved from store to machine area)
        function markMaterialAvailable(allocationId) {
            if (confirm('Confirm that material has been moved from store to machine area?')) {
                db.collection('allocations').doc(allocationId).update({
                    materialAvailable: true,
                    materialAvailableDate: firebase.firestore.FieldValue.serverTimestamp(),
                    materialAvailableBy: localStorage.getItem('username') || 'Production Operator'
                }).then(() => {
                    alert('Material marked as available at machine area');
                    loadMachineAllocations(currentMachine);
                }).catch(error => {
                    console.error('Error updating material availability:', error);
                    alert('Error updating material availability');
                });
            }
        }

        // Start production for an allocation
        let startingProduction = false;
        function startProduction(allocationId) {
            if (startingProduction) return;
            startingProduction = true;

            db.collection('allocations').doc(allocationId).get().then(doc => {
                if (!doc.exists) {
                    alert('Allocation not found');
                    return;
                }
                
                const allocation = doc.data();
                
                // Materials must have been issued / confirmed before the machine starts
                if (allocation.materialAvailable !== true) {
                    alert('Materials must be issued by the Store before starting production');
                    return;
                }
                
                const jobId = 'JOB-' + Date.now();
                const user = localStorage.getItem('username') || localStorage.getItem('userEmail') || 'Production Operator';
                
                // UOM always comes from the Store inventory master
                const uomPromise = allocation.uom
                    ? Promise.resolve(normalizeUom(allocation.uom))
                    : db.collection('inventory').where('materialId', '==', allocation.fgProductId).get().then(s => {
                        let u = '';
                        s.forEach(d => { if (!u && d.data().uom) u = d.data().uom; });
                        return normalizeUom(u) || 'kg';
                    });
                
                return Promise.all([uomPromise, getJobComponents(allocation)]).then(([uom, components]) => {
                    const jobData = {
                        jobId: jobId,
                        allocationId: allocationId,
                        machine: allocation.machine,
                        materialId: allocation.fgProductId,
                        materialName: allocation.fgProductName,
                        customer: allocation.customer,
                        customerId: allocation.customer,
                        orderId: allocation.orderId,
                        allocatedQuantity: allocation.orderQuantity,
                        uom: uom,
                        components: components,
                        status: 'in-progress',
                        startDate: firebase.firestore.FieldValue.serverTimestamp(),
                        startedBy: user,
                        operatorName: user,
                        bomId: allocation.bomId || '',
                        orderReference: allocation.orderReference || '',
                        plannerName: allocation.allocatedBy || '',
                        fgProductId: allocation.fgProductId,
                        allocatedBy: allocation.allocatedBy || '',
                        allocatedDate: allocation.allocatedDate || null
                    };
                    
                    return db.collection('production_jobs').doc(jobId).set(jobData).then(() => {
                        alert(`Production started for ${jobData.materialName} on ${allocation.machine}`);
                        showModule('production');
                        document.getElementById('productionMachine').value = allocation.machine;
                        loadMachineAllocationsForProduction();
                        setTimeout(() => {
                            document.getElementById('productionAllocation').value = jobId;
                            document.getElementById('plannerName').value = jobData.plannerName;
                            document.getElementById('fgProductId').value = jobData.fgProductId;
                            const now = new Date();
                            document.getElementById('startDate').value = now.toISOString().slice(0, 16);
                            onProductionJobSelected(jobId);
                        }, 500);
                    });
                });
            }).catch(error => {
                console.error('Error starting production:', error);
                alert('Error starting production');
            }).finally(() => { startingProduction = false; });
        }

        // Load machines for production form
        function loadProductionMachines() {
            const machineSelect = document.getElementById('productionMachine');
            machineSelect.innerHTML = '<option value="">Select Machine</option>';
            
            const machines = [
                { id: 'CLADDING-1', name: 'CLADDING-1 - Cladding Machine' },
                { id: 'CUTTING-1', name: 'CUTTING-1 - Cutting Machine' },
                { id: 'ASSEMBLY-1', name: 'ASSEMBLY-1 - Assembly Line' },
                { id: 'EXTRUSION-1', name: 'EXTRUSION-1 - Fiber Extrusion' }
            ];
            
            machines.forEach(machine => {
                const option = document.createElement('option');
                option.value = machine.id;
                option.textContent = machine.name;
                machineSelect.appendChild(option);
            });
        }

        // Load machine allocations for production form
        function loadMachineAllocationsForProduction() {
            const machineId = document.getElementById('productionMachine').value;
            const allocationSelect = document.getElementById('productionAllocation');
            allocationSelect.innerHTML = '<option value="">Select Allocation</option>';
            
            if (!machineId) return;
            
            db.collection('production_jobs')
                .where('machine', '==', machineId)
                .where('status', '==', 'in-progress')
                .get()
                .then(snapshot => {
                    snapshot.forEach(doc => {
                        const job = doc.data();
                        const option = document.createElement('option');
                        option.value = doc.id;
                        option.textContent = `${job.materialName} - ${job.customer} (${job.allocatedQuantity} ${normalizeUom(job.uom)})`;
                        allocationSelect.appendChild(option);
                    });
                });
        }

        // Save production data
        // Fill UOM labels + raw-material scrap table for the selected job
        function onProductionJobSelected(jobId) {
            const section = document.getElementById('rmScrapSection');
            const body = document.getElementById('rmScrapBody');
            if (!jobId) {
                section.style.display = 'none';
                body.innerHTML = '';
                document.getElementById('outputUomLabel').textContent = 'UOM';
                document.getElementById('scrapUomLabel').textContent = 'UOM';
                return;
            }
            db.collection('production_jobs').doc(jobId).get().then(doc => {
                if (!doc.exists) return;
                const job = doc.data();
                const u = normalizeUom(job.uom) || 'kg';
                document.getElementById('outputUomLabel').textContent = u;
                document.getElementById('scrapUomLabel').textContent = u;

                const comps = (Array.isArray(job.components) && job.components.length)
                    ? Promise.resolve(job.components)
                    : bomComponentsFallback({ bomId: job.bomId, orderQuantity: job.allocatedQuantity });

                return comps.then(list => {
                    if (!list.length) {
                        section.style.display = 'none';
                        body.innerHTML = '';
                        return;
                    }
                    body.innerHTML = list.map(c => {
                        const issued = c.issuedQty !== undefined ? (Number(c.issuedQty) || 0) : (Number(c.requiredQty) || 0);
                        const uom = normalizeUom(c.uom);
                        return `<tr data-material-id="${escAttr(c.materialId)}" data-material-name="${escAttr(c.materialName)}" data-uom="${escAttr(uom)}" data-issued="${issued}">
                            <td>${escAttr(c.materialId)}</td>
                            <td>${escAttr(c.materialName)}</td>
                            <td>${issued}</td>
                            <td>${escAttr(uom)}</td>
                            <td><input type="number" class="form-control form-control-sm rm-scrap-qty" min="0" step="any" value="0" style="max-width:120px"></td>
                            <td><select class="form-select form-select-sm rm-scrap-reason">${SCRAP_REASON_OPTIONS}</select></td>
                        </tr>`;
                    }).join('');
                    section.style.display = 'block';
                });
            }).catch(err => console.error('Error loading job details:', err));
        }

        let savingProduction = false;
        function saveProductionData(e) {
            e.preventDefault();
            if (savingProduction) return;
            
            const jobId = document.getElementById('productionAllocation').value;
            const productionOutput = parseFloat(document.getElementById('productionOutput').value);
            const scrapQuantity = parseFloat(document.getElementById('scrapQuantity').value) || 0;
            const scrapReason = document.getElementById('scrapReason').value;
            const remarks = document.getElementById('productionRemarks').value;
            const plannerName = document.getElementById('plannerName').value;
            const fgProductId = document.getElementById('fgProductId').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!jobId || isNaN(productionOutput)) {
                alert('Please fill all required fields');
                return;
            }
            if (scrapQuantity > 0 && !scrapReason) {
                alert('Please select a reason for the FG scrap');
                return;
            }

            // Raw material (BOM item) scrap
            const rmScrap = [];
            let problem = '';
            document.querySelectorAll('#rmScrapBody tr[data-material-id]').forEach(tr => {
                const qty = parseFloat(tr.querySelector('.rm-scrap-qty').value) || 0;
                const reason = tr.querySelector('.rm-scrap-reason').value;
                const issued = parseFloat(tr.dataset.issued) || 0;
                if (qty < 0) problem = 'Scrap quantity cannot be negative';
                if (qty > 0) {
                    if (!reason) problem = `Select a scrap reason for ${tr.dataset.materialName}`;
                    if (issued > 0 && qty > issued) problem = `Scrap of ${tr.dataset.materialName} (${qty}) is more than issued (${issued})`;
                    rmScrap.push({
                        materialId: tr.dataset.materialId,
                        materialName: tr.dataset.materialName,
                        uom: tr.dataset.uom,
                        issuedQty: issued,
                        scrapQty: qty,
                        scrapReason: reason
                    });
                }
            });
            if (problem) {
                alert(problem);
                return;
            }
            
            savingProduction = true;
            const submitBtn = document.querySelector('#productionForm button[type="submit"]');
            if (submitBtn) submitBtn.disabled = true;
            
            db.collection('production_jobs').doc(jobId).get().then(doc => {
                if (!doc.exists) {
                    alert('Production job not found');
                    return;
                }
                
                const job = doc.data();
                const user = localStorage.getItem('username') || localStorage.getItem('userEmail') || 'Production Operator';
                const jobUom = normalizeUom(job.uom) || 'kg';
                
                const updateData = {
                    status: 'completed',
                    productionOutput: productionOutput,
                    scrapQuantity: scrapQuantity,
                    scrapReason: scrapReason || '',
                    rmScrap: rmScrap,
                    uom: jobUom,
                    completionDate: firebase.firestore.FieldValue.serverTimestamp(),
                    completedBy: user,
                    operatorName: user,
                    remarks: remarks
                };
                if (plannerName) updateData.plannerName = plannerName;
                if (fgProductId) updateData.fgProductId = fgProductId;
                if (startDate) updateData.actualStartDate = new Date(startDate);
                if (endDate) updateData.actualEndDate = new Date(endDate);
                
                return db.collection('production_jobs').doc(jobId).update(updateData)
                    .then(() => {
                        const stamp = Date.now();
                        const base = {
                            jobId: jobId,
                            machine: job.machine,
                            customer: job.customer,
                            customerId: job.customerId || job.customer,
                            orderId: job.orderId,
                            date: firebase.firestore.FieldValue.serverTimestamp(),
                            recordedBy: user,
                            operatorName: user,
                            remarks: remarks,
                            bomId: job.bomId || '',
                            fgProductId: job.fgProductId || fgProductId || '',
                            plannerName: job.plannerName || plannerName || ''
                        };
                        const batch = db.batch();

                        // FG scrap (one record per job, as before)
                        const fgScrapId = 'SCRAP-' + stamp;
                        batch.set(db.collection('scrap_records').doc(fgScrapId), {
                            ...base,
                            scrapId: fgScrapId,
                            scrapType: 'FG',
                            materialId: job.materialId,
                            materialName: job.materialName,
                            scrapQuantity: scrapQuantity,
                            scrapReason: scrapReason || '',
                            productionOutput: productionOutput,
                            uom: jobUom
                        });

                        // Raw material (BOM item) scrap
                        rmScrap.forEach((rm, i) => {
                            const rmScrapId = 'SCRAP-' + stamp + '-RM' + (i + 1);
                            batch.set(db.collection('scrap_records').doc(rmScrapId), {
                                ...base,
                                scrapId: rmScrapId,
                                scrapType: 'RM',
                                materialId: rm.materialId,
                                materialName: rm.materialName,
                                scrapQuantity: rm.scrapQty,
                                scrapReason: rm.scrapReason,
                                issuedQuantity: rm.issuedQty,
                                uom: rm.uom
                            });
                        });
                        return batch.commit();
                    }).then(() => {
                        return db.collection('allocations').doc(job.allocationId).update({
                            status: 'completed',
                            completionDate: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }).then(() => {
                        alert('Production data saved successfully!');
                        document.getElementById('productionForm').reset();
                        onProductionJobSelected('');
                        loadDashboardData();
                        showModule('dashboard');
                    });
            }).catch(error => {
                console.error('Error saving production data:', error);
                alert('Error saving production data');
            }).finally(() => {
                savingProduction = false;
                if (submitBtn) submitBtn.disabled = false;
            });
        }

        // Complete job directly from dashboard
        function completeJob(jobId) {
            showModule('production');
            document.getElementById('productionAllocation').value = jobId;
            onProductionJobSelected(jobId);
            
            // Load job details to pre-fill form
            db.collection('production_jobs').doc(jobId).get().then(doc => {
                if (doc.exists) {
                    const job = doc.data();
                    document.getElementById('plannerName').value = job.plannerName || job.allocatedBy || '';
                    document.getElementById('fgProductId').value = job.fgProductId || '';
                    
                    // Set current datetime for end date
                    const now = new Date();
                    document.getElementById('endDate').value = now.toISOString().slice(0, 16);
                    
                    // If start date exists in job, pre-fill it
                    if (job.startDate) {
                        const startDate = job.startDate.toDate();
                        document.getElementById('startDate').value = startDate.toISOString().slice(0, 16);
                    } else {
                        // Set current datetime for start date if not exists
                        document.getElementById('startDate').value = now.toISOString().slice(0, 16);
                    }
                }
            });
        }

        // Load scrap records
        function loadScrapRecords() {
            const scrapBody = document.getElementById('scrapRecordsBody');
            scrapBody.innerHTML = '<tr><td colspan="11" class="text-center">Loading...</td></tr>';
            
            db.collection('scrap_records')
                .get()
                .then(snapshot => {
                    scrapBody.innerHTML = '';
                    
                    if (snapshot.empty) {
                        scrapBody.innerHTML = '<tr><td colspan="11" class="text-center text-muted">No scrap records found</td></tr>';
                        return;
                    }
                    
                    // Convert to array and sort client-side
                    const scrapRecords = [];
                    snapshot.forEach(doc => {
                        scrapRecords.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Sort by date descending
                    scrapRecords.sort((a, b) => {
                        const dateA = a.date?.toDate() || new Date(0);
                        const dateB = b.date?.toDate() || new Date(0);
                        return dateB - dateA;
                    });
                    
                    // Limit to 50 records
                    const limitedRecords = scrapRecords.slice(0, 50);
                    
                    limitedRecords.forEach(scrap => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${scrap.date?.toDate().toLocaleDateString() || '-'}</td>
                            <td>${scrap.machine || '-'}</td>
                            <td>${scrap.bomId || '-'}</td>
                            <td>${scrap.orderId || '-'}</td>
                            <td>${scrap.customer || '-'}</td>
                            <td>${scrap.fgProductId || '-'}</td>
                            <td><span class="badge ${scrap.scrapType === 'RM' ? 'bg-info' : 'bg-secondary'}">${scrap.scrapType || 'FG'}</span></td>
                            <td>${escAttr(scrap.materialName || '-')}</td>
                            <td>${scrap.operatorName || scrap.recordedBy || '-'}</td>
                            <td>${scrap.scrapQuantity || 0} ${normalizeUom(scrap.uom) || 'kg'}</td>
                            <td>${formatScrapReason(scrap.scrapReason)}</td>
                        `;
                        scrapBody.appendChild(row);
                    });
                });
        }

        // Format scrap reason for display
        function formatScrapReason(reason) {
            const reasons = {
                'DIMENSION_ISSUE': 'Dimension Issue',
                'QUALITY_DEFECT': 'Quality Defect',
                'MACHINE_ERROR': 'Machine Error',
                'MATERIAL_ISSUE': 'Material Issue',
                'OPERATOR_ERROR': 'Operator Error',
                'OTHER': 'Other'
            };
            return reasons[reason] || reason;
        }

        // Load order analysis filters
        function loadOrderFilters() {
            const orderFilter = document.getElementById('orderFilter');
            orderFilter.innerHTML = '<option value="">All Orders</option>';
            
            // Get unique orders from allocations
            db.collection('allocations').get().then(snapshot => {
                const orders = new Set();
                
                snapshot.forEach(doc => {
                    const allocation = doc.data();
                    if (allocation.orderId) {
                        orders.add(allocation.orderId);
                    }
                });
                
                orders.forEach(orderId => {
                    const option = document.createElement('option');
                    option.value = orderId;
                    option.textContent = orderId;
                    orderFilter.appendChild(option);
                });
                
                // Load initial analysis
                loadOrderAnalysis();
            });
        }

        // Load order analysis
        function loadOrderAnalysis() {
            const orderId = document.getElementById('orderFilter').value;
            const dateRange = document.getElementById('dateRangeFilter').value;
            const resultsDiv = document.getElementById('orderAnalysisResults');
            
            resultsDiv.innerHTML = '<div class="text-center">Loading analysis...</div>';
            
            // Calculate date range
            let startDate = new Date(0); // Beginning of time
            const endDate = new Date();
            
            if (dateRange === 'today') {
                startDate = new Date();
                startDate.setHours(0, 0, 0, 0);
            } else if (dateRange === 'week') {
                startDate = new Date();
                startDate.setDate(startDate.getDate() - 7);
            } else if (dateRange === 'month') {
                startDate = new Date();
                startDate.setMonth(startDate.getMonth() - 1);
            }
            
            Promise.all([
                db.collection('allocations').get(),
                db.collection('production_jobs').get(),
                db.collection('scrap_records').get()
            ]).then(([allocationsSnapshot, jobsSnapshot, scrapSnapshot]) => {
                // Process data
                const orderData = {};
                
                // Process allocations
                allocationsSnapshot.forEach(doc => {
                    const allocation = doc.data();
                    const allocOrderId = allocation.orderId;
                    
                    if (!allocOrderId) return;
                    if (orderId && allocOrderId !== orderId) return;
                    
                    if (!orderData[allocOrderId]) {
                        orderData[allocOrderId] = {
                            orderId: allocOrderId,
                            customer: allocation.customer,
                            allocatedQuantity: 0,
                            producedQuantity: 0,
                            scrapQuantity: 0,
                            jobs: [],
                            allocations: []
                        };
                    }
                    
                    orderData[allocOrderId].allocatedQuantity += parseFloat(allocation.orderQuantity || allocation.quantity || 0);
                    orderData[allocOrderId].allocations.push(allocation);
                });
                
                // Process production jobs
                jobsSnapshot.forEach(doc => {
                    const job = doc.data();
                    const jobOrderId = job.orderId;
                    
                    if (!jobOrderId) return;
                    if (orderId && jobOrderId !== orderId) return;
                    
                    // Check date filter for completed jobs
                    if (job.status === 'completed') {
                        const completionDate = job.completionDate?.toDate();
                        if (completionDate && completionDate < startDate) {
                            return;
                        }
                    }
                    
                    if (!orderData[jobOrderId]) {
                        orderData[jobOrderId] = {
                            orderId: jobOrderId,
                            customer: job.customer,
                            allocatedQuantity: 0,
                            producedQuantity: 0,
                            scrapQuantity: 0,
                            jobs: [],
                            allocations: []
                        };
                    }
                    
                    orderData[jobOrderId].producedQuantity += parseFloat(job.productionOutput || 0);
                    orderData[jobOrderId].jobs.push(job);
                });
                
                // Process scrap records
                scrapSnapshot.forEach(doc => {
                    const scrap = doc.data();
                    const scrapOrderId = scrap.orderId;
                    
                    if (!scrapOrderId) return;
                    if (orderId && scrapOrderId !== orderId) return;
                    
                    // Check date filter
                    const scrapDate = scrap.date?.toDate();
                    if (scrapDate && scrapDate < startDate) {
                        return;
                    }
                    
                    if (!orderData[scrapOrderId]) {
                        orderData[scrapOrderId] = {
                            orderId: scrapOrderId,
                            customer: scrap.customer,
                            allocatedQuantity: 0,
                            producedQuantity: 0,
                            scrapQuantity: 0,
                            jobs: [],
                            allocations: []
                        };
                    }
                    
                    if (scrap.scrapType !== 'RM') orderData[scrapOrderId].scrapQuantity += parseFloat(scrap.scrapQuantity || 0);
                });
                
                // Display results
                displayOrderAnalysis(orderData);
            }).catch(error => {
                console.error('Error loading order analysis:', error);
                resultsDiv.innerHTML = '<div class="text-center text-danger">Error loading analysis</div>';
            });
        }

        // Display order analysis results
        function displayOrderAnalysis(orderData) {
            const resultsDiv = document.getElementById('orderAnalysisResults');
            
            if (Object.keys(orderData).length === 0) {
                resultsDiv.innerHTML = '<div class="text-center text-muted">No data found for selected filters</div>';
                return;
            }
            
            let html = '';
            
            Object.values(orderData).forEach(order => {
                const completionRate = order.allocatedQuantity > 0 ? 
                    (order.producedQuantity / order.allocatedQuantity * 100).toFixed(1) : 0;
                const scrapRate = order.producedQuantity > 0 ? 
                    (order.scrapQuantity / order.producedQuantity * 100).toFixed(1) : 0;
                
                html += `
                    <div class="card analysis-card mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">Order: ${order.orderId} - ${order.customer}</h5>
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <div class="card stats-card">
                                        <div class="stats-number text-primary">${order.allocatedQuantity}</div>
                                        <div class="stats-label">Allocated</div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card stats-card">
                                        <div class="stats-number text-success">${order.producedQuantity}</div>
                                        <div class="stats-label">Produced</div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card stats-card">
                                        <div class="stats-number text-danger">${order.scrapQuantity}</div>
                                        <div class="stats-label">FG Scrap</div>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="card stats-card">
                                        <div class="stats-number text-info">${completionRate}%</div>
                                        <div class="stats-label">Completion Rate</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <h6>Production Progress</h6>
                                    <div class="progress mb-2">
                                        <div class="progress-bar bg-success" style="width: ${Math.min(completionRate, 100)}%">
                                            ${completionRate}%
                                        </div>
                                    </div>
                                    <small>${order.producedQuantity} of ${order.allocatedQuantity} produced</small>
                                </div>
                                <div class="col-md-6">
                                    <h6>Scrap Rate</h6>
                                    <div class="progress mb-2">
                                        <div class="progress-bar bg-danger" style="width: ${Math.min(scrapRate, 100)}%">
                                            ${scrapRate}%
                                        </div>
                                    </div>
                                    <small>${order.scrapQuantity} scrap from ${order.producedQuantity} produced</small>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <h6>Materials Allocated</h6>
                                    <ul class="list-group">
                                        ${order.allocations.map(allocation => `
                                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                                ${allocation.fgProductName || allocation.materialName}
                                                <span class="badge bg-primary rounded-pill">
                                                    ${allocation.orderQuantity || allocation.quantity} ${normalizeUom(allocation.uom) || 'units'}
                                                </span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                                <div class="col-md-6">
                                    <h6>Production Jobs</h6>
                                    <ul class="list-group">
                                        ${order.jobs.map(job => `
                                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                                ${job.materialName}
                                                <span class="badge ${job.status === 'completed' ? 'bg-success' : 'bg-warning'} rounded-pill">
                                                    ${job.status}
                                                </span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }

        // Handle index errors
        function handleIndexError(error) {
            if (error.code === 'failed-precondition' && error.message.includes('index')) {
                const indexUrlMatch = error.message.match(/https:\/\/[^ ]+/);
                if (indexUrlMatch) {
                    currentIndexUrl = indexUrlMatch[0];
                    document.getElementById('indexMessage').textContent = 
                        'A Firestore index is required for this query. Click "Create Index" to set it up.';
                    document.getElementById('indexAlert').style.display = 'block';
                }
            }
        }

        // Create index
        function createIndex() {
            if (currentIndexUrl) {
                window.open(currentIndexUrl, '_blank');
            }
        }

        // Dismiss alert
        function dismissAlert() {
            document.getElementById('indexAlert').style.display = 'none';
        }

        // Handle logout
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('userRole');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('username');
                (window.top || window).location.href = 'index.html';
            }
        }
    \u003c/script>
</body>
</html>
</script>
<script type="text/plain" id="app-quality">
<!DOCTYPE html>
<html lang="en">
<head>
<script>
window.ERP_EMBEDDED = true;
// ============================================================
// UNIT OF MEASURE - one master list shared by Store / Planner / Production / Quality.
// The Store inventory UOM is the source of truth; every other dashboard must use
// these exact values (kg, meter, roll, piece, box, unit).
// ============================================================
var UOM_MASTER = ['kg', 'meter', 'roll', 'piece', 'box', 'unit'];
function normalizeUom(u) {
    var s = String(u === undefined || u === null ? '' : u).trim().toLowerCase().replace(/\./g, '');
    var map = {
        'kg': 'kg', 'kgs': 'kg', 'kilogram': 'kg', 'kilograms': 'kg', 'kilogram (kg)': 'kg',
        'm': 'meter', 'mtr': 'meter', 'mtrs': 'meter', 'meter': 'meter', 'meters': 'meter', 'metre': 'meter', 'metres': 'meter',
        'roll': 'roll', 'rolls': 'roll',
        'pc': 'piece', 'pcs': 'piece', 'piece': 'piece', 'pieces': 'piece', 'nos': 'piece',
        'box': 'box', 'boxes': 'box',
        'unit': 'unit', 'units': 'unit'
    };
    return Object.prototype.hasOwnProperty.call(map, s) ? map[s] : s;
}

\u003c/script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --info-color: #17a2b8;
            --scrap-color: #95a5a6;
        }
        
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: linear-gradient(135deg, var(--secondary-color), #1a252f);
        }
        
        .sidebar {
            background-color: white;
            min-height: calc(100vh - 56px);
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .sidebar .nav-link {
            color: var(--secondary-color);
            padding: 12px 20px;
            border-left: 4px solid transparent;
        }
        
        .sidebar .nav-link.active {
            background-color: rgba(52, 152, 219, 0.1);
            border-left-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: 600;
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-success {
            background-color: var(--success-color);
            border-color: var(--success-color);
        }
        
        .btn-warning {
            background-color: var(--warning-color);
            border-color: var(--warning-color);
        }
        
        .btn-danger {
            background-color: var(--danger-color);
            border-color: var(--danger-color);
        }
        
        .btn-scrap {
            background-color: var(--scrap-color);
            border-color: var(--scrap-color);
            color: white;
        }
        
        .stats-card {
            text-align: center;
            padding: 20px;
        }
        
        .stats-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stats-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .module-section {
            display: none;
        }
        
        .module-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .badge-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .badge-approved {
            background-color: #d4edda;
            color: #155724;
        }
        
        .badge-rejected {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .badge-rework {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .badge-scrap {
            background-color: #e2e3e5;
            color: #383d41;
        }
        
        .badge-rework-created {
            background-color: #cce7ff;
            color: #004085;
        }
        
        .qc-item {
            border-left: 4px solid var(--primary-color);
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .qc-item:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .qc-item.pending {
            border-left-color: var(--warning-color);
        }
        
        .qc-item.approved {
            border-left-color: var(--success-color);
        }
        
        .qc-item.rejected {
            border-left-color: var(--danger-color);
        }
        
        .qc-item.rework {
            border-left-color: var(--warning-color);
        }
        
        .qc-item.scrap {
            border-left-color: var(--scrap-color);
        }
        
        .alert {
            margin-bottom: 10px;
        }
        
        .size-input-group {
            display: flex;
            gap: 10px;
        }
        
        .size-input {
            flex: 1;
        }
        
        .dimension-inputs {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .category-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
        }
        
        .qc-record-header {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .qc-record-details {
            padding: 10px 15px;
        }
        
        .detail-row {
            display: flex;
            margin-bottom: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        
        .detail-label {
            font-weight: 600;
            min-width: 150px;
            color: #495057;
        }
        
        .detail-value {
            flex: 1;
            color: #6c757d;
        }
        
        .rejection-section {
            background-color: #f8d7da;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            border-left: 4px solid var(--danger-color);
        }
        
        .scrap-inventory-badge {
            background-color: var(--scrap-color);
            color: white;
        }
        
        .rework-inventory-badge {
            background-color: var(--warning-color);
            color: white;
        }
    </style>
</head>

        // Load dashboard statistics
        function loadDashboardStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            // Pending QC
            db.collection('production_jobs')
                .where('status', '==', 'completed')
                .get()
                .then(snapshot => {
                    let pendingCount = 0;
                    snapshot.forEach(doc => {
                        const job = doc.data();
                        // Check if QC is not yet done
                        if (!job.qcStatus || job.qcStatus === 'pending') {
                            pendingCount++;
                        }
                    });
                    document.getElementById('pendingQC').textContent = pendingCount;
                });

            // Approved today
            db.collection('qc_records')
                .where('qcDate', '>=', today)
                .where('status', '==', 'approved')
                .get()
                .then(snapshot => {
                    document.getElementById('approvedToday').textContent = snapshot.size;

            // Rejected today
            db.collection('qc_records')
                .where('qcDate', '>=', today)
                .where('status', '==', 'rejected')
                .get()
                .then(snapshot => {
                    document.getElementById('rejectedToday').textContent = snapshot.size;
                });

            // Rework today
            db.collection('qc_records')
                .where('qcDate', '>=', today)
                .where('status', '==', 'rework')
                .get()
                .then(snapshot => {
                    document.getElementById('reworkToday').textContent = snapshot.size;
                });

        // Load pending QC items

// Submit QC report - CORRECTED VERSION
function submitQCReport(e) {
    e.preventDefault();
    
    const jobId = document.getElementById('qcJobSelect').value;
    const status = document.querySelector('input[name="qualityStatus"]:checked')?.value;
    const length = document.getElementById('dimensionLength').value;
    const width = document.getElementById('dimensionWidth').value;
    const height = document.getElementById('dimensionHeight').value;
    const sizeCategory = document.getElementById('sizeCategory').value;
    const inventoryCategory = document.getElementById('inventoryCategory').value;
    const weight = document.getElementById('weight').value;
    const remarks = document.getElementById('qcRemarks').value;
    
    // Rejection details
    const rejectionReason = document.getElementById('rejectionReason').value;
    const disposition = document.getElementById('disposition').value;
    const rejectionNotes = document.getElementById('rejectionNotes').value;
    
    // Validation
    if (!jobId || !status || !inventoryCategory) {
        alert('Please select a job, quality status, and inventory category');
        return;
    }
    
    if (status === 'rejected' && (!rejectionReason || !disposition)) {
        alert('Please provide rejection reason and disposition for rejected items');
        return;
    }
    
    if (!currentJob) {
        alert('Job data not loaded properly');
        return;
    }
    
    const user = localStorage.getItem('username') || localStorage.getItem('userEmail') || 'Quality Inspector';
    const dimensions = (length || width || height) ? 
        `${length || '-'}x${width || '-'}x${height || '-'} mm` : null;
    
    // Create QC record
    const qcId = 'QC-' + Date.now();
    const qcData = {
        qcId: qcId,
        jobId: currentJob.jobId || '',
        productionJobId: jobId,
        machine: currentJob.machine || '',
        materialId: currentJob.materialId || '',
        materialName: currentJob.materialName || '',
        customer: currentJob.customer || '',
        productionQuantity: currentJob.productionOutput || 0,
        uom: normalizeUom(currentJob.uom),
        dimensions: dimensions || '',
        sizeCategory: sizeCategory || '',
        inventoryCategory: inventoryCategory || '',
        weight: weight || '',
        status: status,
        remarks: remarks || '',
        inspector: user,
        qcDate: firebase.firestore.FieldValue.serverTimestamp(),
        orderId: currentJob.orderId || '',
        fgProductName: currentJob.materialName || '',
        inventoryStatus: 'qc_hold' // Initial status - material in QC hold
    };
    
    // Add rejection details if rejected
    if (status === 'rejected') {
        qcData.rejectionReason = rejectionReason;
        qcData.disposition = disposition;
        qcData.rejectionNotes = rejectionNotes;
        qcData.inventoryStatus = 'rejection_hold';
    } else if (status === 'rework') {
        qcData.inventoryStatus = 'rework_hold';
    }
    
    // Remove any undefined values
    Object.keys(qcData).forEach(key => {
        if (qcData[key] === undefined) {
            qcData[key] = '';
        }
    });
    
    console.log('Submitting QC data:', qcData);
    
    // Save QC record
    db.collection('qc_records').doc(qcId).set(qcData)
        .then(() => {
            // Update production job with QC status
            const updateData = {
                qcStatus: status,
                qcDate: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            if (dimensions) updateData.dimensions = dimensions;
            if (sizeCategory) updateData.sizeCategory = sizeCategory;
            if (inventoryCategory) updateData.inventoryCategory = inventoryCategory;
            if (weight) updateData.weight = weight;
            
            return db.collection('production_jobs').doc(jobId).update(updateData);
        })
        .then(() => {
            // Add to QC inventory based on status
            return addToQCInventory(qcData);
        })
        .then(() => {
            alert('QC report submitted successfully! Material is now in QC inventory.');
            document.getElementById('qualityForm').reset();
            document.getElementById('jobDetails').style.display = 'none';
            document.getElementById('rejectionDetails').style.display = 'none';
            loadDashboardData();
            loadQCInventory(); // Load QC inventory to show the new item
            showModule('quality'); // Stay in quality module
        })
        .catch(error => {
            console.error('Error submitting QC report:', error);
            alert('Error submitting QC report: ' + error.message);
        });
}

// Add to QC Inventory (all materials go here first)
function addToQCInventory(qcData) {
    const qcInventoryId = 'QC-INV-' + Date.now();
    const sizeInfo = qcData.sizeCategory ? ` (${qcData.sizeCategory})` : '';
    const dimensionInfo = qcData.dimensions ? ` - ${qcData.dimensions}` : '';

        dimensions: qcData.dimensions || '',
        weight: qcData.weight || '',
        category: qcData.inventoryCategory || 'FG',

        inventoryStatus: qcData.inventoryStatus,
