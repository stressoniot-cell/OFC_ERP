// ============================================================
// UNIT OF MEASURE - one master list shared by Store / Planner / Production / Quality.
// The Store inventory UOM is the source of truth; every other dashboard must use
// these exact values (kg, meter, roll, piece, box, unit).
// ============================================================
var UOM_MASTER = ['kg', 'meter', 'roll', 'piece', 'box', 'unit'];
function normalizeUom(u) {
    var s = String(u === undefined || u === null ? '' : u).trim().toLowerCase().replace(/\./g, '');
    var map = {
        'kg': 'kg', 'kgs': 'kg', 'kilogram': 'kg', 'kilograms': 'kg', 'kilogram (kg)': 'kg',
        'm': 'meter', 'mtr': 'meter', 'mtrs': 'meter', 'meter': 'meter', 'meters': 'meter', 'metre': 'meter', 'metres': 'meter',
        'roll': 'roll', 'rolls': 'roll',
        'pc': 'piece', 'pcs': 'piece', 'piece': 'piece', 'pieces': 'piece', 'nos': 'piece',
        'box': 'box', 'boxes': 'box',
        'unit': 'unit', 'units': 'unit'
    };
    return Object.prototype.hasOwnProperty.call(map, s) ? map[s] : s;
}

<div id="materialFormModule" class="module-section">

                            <input type="text" class="form-control" id="materialName" required>

                        </div>

                                <option value="meter">Meter</option>
                                <option value="roll">Roll</option>
                                <option value="piece">Piece</option>

// Load inventory with pagination - FIXED CONSOLIDATION VERSION
function loadInventory() {
    const inventoryBody = document.getElementById('inventoryTableBody');
    inventoryBody.innerHTML = '<tr><td colspan="11" class="text-center">Loading...</td></tr>';
    
    db.collection('inventory').get().then(snapshot => {
        // Group materials by materialId to consolidate duplicates
        const consolidatedInventory = [];
        const materialMap = new Map();
        
        snapshot.forEach(doc => {
            const data = doc.data();
            const key = data.materialId; // Use materialId as the grouping key
            
            if (materialMap.has(key)) {
                // Update existing consolidated material
                const existing = materialMap.get(key);
                
                // SUM the current stock (0 + 8 = 8)
                existing.currentStock += data.currentStock;
                
                // Keep the most recent lastUpdated date
                if (data.lastUpdated && existing.lastUpdated) {
                    const existingDate = existing.lastUpdated.toDate();
                    const newDate = data.lastUpdated.toDate();
                    if (newDate > existingDate) {
                        existing.lastUpdated = data.lastUpdated;
                    }
                } else if (data.lastUpdated) {
                    existing.lastUpdated = data.lastUpdated;
                }
                
                // Update status based on cumulative stock
                if (existing.currentStock <= 0) {
                    existing.status = "Out of Stock";
                } else if (existing.currentStock <= existing.reorderLevel) {
                    existing.status = "Low Stock";
                } else {
                    existing.status = "Available";
                }
                
                // Track that this is consolidated from multiple entries
                existing.isConsolidated = true;
                if (!existing.consolidatedIds) {
                    existing.consolidatedIds = [existing.id];
                }
                existing.consolidatedIds.push(doc.id);
                
            } else {
                // Add new material to map
                materialMap.set(key, {
                    id: doc.id,
                    ...data,
                    isConsolidated: false,
                    consolidatedIds: [doc.id]
                });
            }
        });
        
        // Add consolidated materials to inventory array
        materialMap.forEach(material => {
            consolidatedInventory.push(material);
        });
        
        filteredInventory = consolidatedInventory;
        totalItems = filteredInventory.length;
        renderInventoryTable();
    }).catch(error => {
        console.error('Error loading inventory:', error);
        inventoryBody.innerHTML = '<tr><td colspan="11" class="text-center text-danger">Error loading inventory</td></tr>';
    });
}

function renderInventoryTable() {
    const inventoryBody = document.getElementById('inventoryTableBody');
    
    if (filteredInventory.length === 0) {
        inventoryBody.innerHTML = '<tr><td colspan="11" class="text-center">No inventory items found</td></tr>';
        return;
    }
    
    let html = '';
    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = Math.min(startIndex + itemsPerPage, filteredInventory.length);
    
    for (let i = startIndex; i < endIndex; i++) {
        const item = filteredInventory[i];
        
        // Format date if exists
        const lastUpdated = item.lastUpdated 
            ? item.lastUpdated.toDate().toLocaleDateString()
            : '-';
        
        // Determine status class
        let statusClass = '';
        switch (item.status) {
            case 'Out of Stock':
                statusClass = 'text-danger';
                break;
            case 'Low Stock':
                statusClass = 'text-warning';
                break;
            case 'Available':
                statusClass = 'text-success';
                break;
        }
        
        html += `
            <tr>
                <td>${item.materialId || '-'}</td>
                <td>${item.materialName || '-'}</td>
                <td>${item.category || '-'}</td>
                <td>${item.description || '-'}</td>
                <td>${item.uom || '-'}</td>
                <td>${item.currentStock || 0}</td>
                <td>${item.reorderLevel || 0}</td>
                <td class="${statusClass}">${item.status || '-'}</td>
                <td>${item.location || '-'}</td>
                <td>${lastUpdated}</td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="requestPassword('edit', '${item.id}', '${item.materialName}')">Edit</button>
                    <button class="btn btn-sm btn-warning" onclick="requestPassword('return', '${item.id}', '${item.materialName}')">Return</button>
                    <button class="btn btn-sm btn-danger" onclick="requestPassword('delete', '${item.id}', '${item.materialName}')">Delete</button>
                </td>
            </tr>
        `;
    }
    
    inventoryBody.innerHTML = html;
    updatePagination();
}

// Update inventory function
function updateInventory() {
    const materialId = document.getElementById('editMaterialId').value;
    const materialName = document.getElementById('editMaterialName').value;
    const category = document.getElementById('editCategory').value;
    const description = document.getElementById('editDescription').value;
    const uom = document.getElementById('editUOM').value;
    const currentStock = parseInt(document.getElementById('editCurrentStock').value);
    const reorderLevel = parseInt(document.getElementById('editReorderLevel').value);
    const location = document.getElementById('editLocation').value;
    
    if (!materialName || !category) {
        alert('Material Name and Category are required!');
        return;
    }
    
    // Determine status based on stock
    let status = "Available";
    if (currentStock <= 0) {
        status = "Out of Stock";
    } else if (currentStock <= reorderLevel) {
        status = "Low Stock";
    }
    
    // Update the material
    db.collection('inventory').doc(materialId).get().then(oldDoc => {
    const oldStock = oldDoc.exists ? (Number(oldDoc.data().currentStock) || 0) : currentStock;
    return db.collection('inventory').doc(materialId).update({
        materialName: materialName,
        category: category,
        description: description,
        uom: uom,
        currentStock: currentStock,
        reorderLevel: reorderLevel,
        location: location,
        status: status,
        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
        const delta = currentStock - oldStock;
        if (delta !== 0) {
            return recordTransaction('ADJUST', materialId, materialName, delta, `Manual stock correction: ${oldStock} -> ${currentStock}`);
        }
    });
    })
    .then(() => {
        alert('Material updated successfully!');
        
        // Hide the modal
        const editModal = bootstrap.Modal.getInstance(document.getElementById('editInventoryModal'));
        editModal.hide();
        
        // Reload inventory
        loadInventory();
        loadDashboardData();
    })
    .catch(error => {
        console.error('Error updating material:', error);
        alert('Error updating material. Please try again.');
    });
}

// Process material return

let returnInProgress = false;

// Process material return (goods going back OUT of the store -> stock REDUCES)
function processMaterialReturn() {
    if (returnInProgress) return;

    const docId = document.getElementById('returnMaterialId').value;
    const materialName = document.getElementById('returnMaterialName').value;
    const quantity = parseFloat(document.getElementById('returnQuantity').value);
    const reason = document.getElementById('returnReason').value.trim();

    if (!quantity || quantity <= 0) {
        alert('Please enter a valid quantity');
        return;
    }
    if (!reason) {
        alert('Please enter a return reason');
        return;
    }

    returnInProgress = true;
    let baseInfo = null;

    db.collection('inventory').doc(docId).get()
        .then(doc => {
            if (!doc.exists) {
                alert('Material not found!');
                return Promise.reject('MATERIAL_NOT_FOUND');
            }
            baseInfo = doc.data();

            // Inventory screen shows the SUM of all entries of one materialId,
            // so validate and deduct against that same total.
            const sameMaterial = baseInfo.materialId
                ? db.collection('inventory').where('materialId', '==', baseInfo.materialId).get()
                : Promise.resolve({ docs: [doc] });

            return sameMaterial.then(snap => {
                let entries = snap.docs.map(d => ({
                    ref: d.ref,
                    id: d.id,
                    data: d.data(),
                    stock: Number(d.data().currentStock) || 0
                }));
                // deduct from the clicked row first, then the others
                entries.sort((a, b) => (b.id === docId) - (a.id === docId));

                const totalStock = entries.reduce((s, e) => s + e.stock, 0);
                if (quantity > totalStock) {
                    alert(`Cannot return ${quantity}. Only ${totalStock} ${baseInfo.uom || ''} in stock.`);
                    return Promise.reject('INSUFFICIENT_STOCK');
                }

                const batch = db.batch();
                let remaining = quantity;
                entries.forEach(e => {
                    if (remaining <= 0 || e.stock <= 0) return;
                    const take = Math.min(e.stock, remaining);
                    const newStock = e.stock - take;          // <-- SUBTRACT
                    remaining -= take;

                    const reorder = Number(e.data.reorderLevel) || 0;
                    const update = {
                        currentStock: newStock,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    if (e.data.status !== 'rejected') {
                        update.status = newStock <= 0 ? 'Out of Stock' : (newStock <= reorder ? 'Low Stock' : 'Available');
                    }
                    batch.update(e.ref, update);
                });
                return batch.commit();
            });
        })
        .then(() => {
            return recordTransaction('RETURN', docId, materialName, quantity, reason, {
                businessId: baseInfo.materialId || docId,
                category: baseInfo.category,
                uom: baseInfo.uom
            });
        })
        .then(() => {
            alert(`Successfully returned ${quantity} ${baseInfo.uom || 'units'} of ${materialName}. Stock reduced.`);
            const modalEl = document.getElementById('returnModal');
            const m = bootstrap.Modal.getInstance(modalEl);
            if (m) m.hide();
            loadInventory();
            loadDashboardData();
        })
        .catch(error => {
            if (error === 'INSUFFICIENT_STOCK' || error === 'MATERIAL_NOT_FOUND') return;
            console.error('Error returning material: ', error);
            alert('Error returning material. Please try again.');
        })
        .finally(() => { returnInProgress = false; });
}

    paginationInfo.textContent = `Showing ${Math.min(itemsPerPage, filteredInventory.length)} of ${totalItems} items`;

    pagination.appendChild(prevLi);
    
    // Page numbers
    for (let i = 1; i <= totalPages; i++) {

        pageLi.className = `page-item ${i === currentPage ? 'active' : ''}`;
        pageLi.innerHTML = `<a class="page-link" href="#">${i}</a>`;

            renderInventoryTable();
        });
        pagination.appendChild(pageLi);
    }
    
    // Next button
    const nextLi = document.createElement('li');
    nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
    nextLi.innerHTML = `<a class="page-link" href="#" ${currentPage === totalPages ? 'tabindex="-1"' : ''}>Next</a>`;
    nextLi.addEventListener('click', (e) => {
        e.preventDefault();
        if (currentPage < totalPages) {
            currentPage++;
            renderInventoryTable();
        }
    });
    pagination.appendChild(nextLi);

    // Filter inventory based on search and filters
    function filterInventory() {
        const searchTerm = document.getElementById('searchInventory').value.toLowerCase();
        const categoryFilter = document.getElementById('filterCategory').value;
        const statusFilter = document.getElementById('filterStatus').value;
        const uomFilter = document.getElementById('filterUOM').value;
        
        db.collection('inventory').get().then(snapshot => {
            filteredInventory = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                
                // Apply filters
                let matches = true;
                
                // Search term
                if (searchTerm && 
                    !data.materialId.toLowerCase().includes(searchTerm) && 
                    !data.materialName.toLowerCase().includes(searchTerm) && 
                    !(data.description && data.description.toLowerCase().includes(searchTerm))) {
                    matches = false;
                }
                
                // Category filter
                if (categoryFilter && data.category !== categoryFilter) {
                    matches = false;
                }
                
                // Status filter
                if (statusFilter) {
                    if (statusFilter === 'available' && (data.currentStock <= data.reorderLevel || data.status === 'rejected')) {
                        matches = false;
                    } else if (statusFilter === 'low' && (data.currentStock === 0 || data.currentStock > data.reorderLevel || data.status === 'rejected')) {
                        matches = false;
                    } else if (statusFilter === 'out' && data.currentStock > 0) {
                        matches = false;
                    } else if (statusFilter === 'rejected' && data.status !== 'rejected') {
                        matches = false;
                    }
                }
                
                // UOM filter
                if (uomFilter && data.uom !== uomFilter) {
                    matches = false;
                }
                
                if (matches) {
                    filteredInventory.push({ id: doc.id, ...data });
                }
            });
            
            totalItems = filteredInventory.length;
            currentPage = 1;
            renderInventoryTable();
        });
    }

    function saveMaterial(e) {
        e.preventDefault();
        
        const materialId = document.getElementById('materialId').value;
        const materialName = document.getElementById('materialName').value;
        const category = document.getElementById('category').value;
        const description = document.getElementById('description').value;

        const materialData = {
            materialId,
            materialName,
            category,
            description,
            uom,
            currentStock,
            reorderLevel,
            lastInvoice,
            lastArrivalDate,
            storeLocation,
            storeIncharge,
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        const editMaterialId = document.getElementById('editMaterialId').value;
        
        // For FG materials, check if material ID already exists (only for new entries)

                .where('category', '==', 'FG')
                .get()
                .then(snapshot => {
                    if (!snapshot.empty) {
                        alert('FG Material ID already exists. FG materials with the same ID will be consolidated. Please use the Receive function instead.');
                        return;
                    }
                    
                    // If no duplicate, add new material
                    addNewMaterial(materialData, materialId, materialName, currentStock);
                });
        } else {
            // For RM, Consumables, or editing existing materials
            if (editMaterialId) {
                // Update existing material
                db.collection('inventory').doc(editMaterialId).get()
                    .then(oldDoc => {
                        const oldStock = oldDoc.exists ? (Number(oldDoc.data().currentStock) || 0) : currentStock;

// Dispatch material - UPDATED VERSION for your form
function dispatchMaterial(e) {
    e.preventDefault();
    
    const materialSelect = document.getElementById('dispatchMaterialSelect');
    const materialId = materialSelect.value;
    const selectedOption = materialSelect.options[materialSelect.selectedIndex];
    const materialName = selectedOption.getAttribute('data-material-name');
    
    const quantity = parseInt(document.getElementById('dispatchQuantity').value);
    const customerId = document.getElementById('customerId').value;
    const orderId = document.getElementById('orderId').value;
    const customerName = document.getElementById('customerName').value;
    const fgProductId = document.getElementById('fgProductId').value;
    const invoice = document.getElementById('dispatchInvoice').value;
    const address = document.getElementById('dispatchAddress').value;
    const remarks = document.getElementById('dispatchRemarks').value;
    
    // Validation
    if (!materialId || materialId === '') {
        alert('Please select a Finished Good material');
        return;
    }
    
    if (!quantity || quantity <= 0) {
        alert('Please enter a valid quantity');
        return;
    }
    
    if (!customerId) {
        alert('Please enter Customer ID');
        return;
    }
    
    if (!customerName) {
        alert('Please enter Customer Name');
        return;
    }
    
    if (!orderId) {
        alert('Please enter Order ID');
        return;
    }
    
    let dispatchUom = '';
    console.log('Dispatching:', { 
        materialId, 
        materialName, 
        quantity, 
        orderId, 
        customerId, 
        customerName,
        fgProductId 
    });
    
    // Get current stock
    db.collection('inventory').doc(materialId).get()
        .then(doc => {
            if (doc.exists) {
                const data = doc.data();
                console.log('Current stock:', data.currentStock);
                dispatchUom = data.uom || '';
                
                if (data.currentStock < quantity) {
                    alert(`Insufficient stock! Available: ${data.currentStock} ${data.uom}`);
                    return Promise.reject('INSUFFICIENT_STOCK');
                }
                
                const newStock = data.currentStock - quantity;
                
                // Update inventory
                return db.collection('inventory').doc(materialId).update({
                    currentStock: newStock,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                });
            } else {
                alert('Material not found!');
                return Promise.reject('MATERIAL_NOT_FOUND');
            }
        })
        .then(() => {
            // Record transaction with all details
            let dispatchRemarks = `Dispatched to ${customerName}`;
            if (customerId) dispatchRemarks += ` (Customer ID: ${customerId})`;
            if (orderId) dispatchRemarks += `, Order: ${orderId}`;
            if (fgProductId) dispatchRemarks += `, FG Product: ${fgProductId}`;
            if (invoice) dispatchRemarks += `, Invoice: ${invoice}`;
            if (address) dispatchRemarks += `, Address: ${address}`;
            if (remarks) dispatchRemarks += `, Remarks: ${remarks}`;
            
            recordTransaction('DISPATCH', materialId, materialName, quantity, dispatchRemarks);
            
            // Show success message
            const successMessage = `Successfully dispatched ${quantity} ${dispatchUom || 'units'} of ${materialName} to ${customerName}`;
            alert(successMessage);
            
            // Reset form
            document.getElementById('dispatchForm').reset();
            loadFGMaterials(); // Reload materials to update stock display
            loadDashboardData(); // Refresh dashboard stats
            
        })
        .catch(error => {
            if (error === 'INSUFFICIENT_STOCK' || error === 'MATERIAL_NOT_FOUND') {
                return; // Error already handled
            }
            console.error('Error dispatching material: ', error);
            alert('Error dispatching material. Please try again.');
        });
}

// MATERIAL MOVEMENT REPORT  (ledger based)
//   Opening + Received - Used/Issued - Dispatched - Returned +/- Adjustment = Closing
// Every movement is read from the 'transactions' collection, so the
// report always agrees with what Receive / Dispatch / Return / Edit did.

const TX_GROUPS = {
    received:   ['RECEIVE', 'ADD', 'REJECTED_QC', 'PRODUCTION_RECEIPT'],
    used:       ['ISSUE', 'ISSUE_TO_PRODUCTION', 'ALLOCATE', 'CONSUME', 'CONSUMED', 'USED'],

function txToDate(t) {
    const v = t.timestamp || t.date;
    if (!v) return null;
    if (typeof v.toDate === 'function') return v.toDate();
    const d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
}

    const table = document.getElementById('materialReportTable');
    const selectedId = document.getElementById('reportMaterialSelect').value;
    const catEl = document.getElementById('reportCategorySelect');
    const selectedCat = catEl ? catEl.value : '';
    const dateFrom = document.getElementById('reportDateFrom').value;
    const dateTo = document.getElementById('reportDateTo').value;
    const startDate = dateFrom ? new Date(dateFrom + 'T00:00:00') : null;
    const endDate = dateTo ? new Date(dateTo + 'T23:59:59.999') : null;

    table.innerHTML = '<tr><td colspan="12" class="text-center">Generating report...</td></tr>';

    logApprovedQCReceipts()
        .catch(e => console.error('QC receipt logging failed:', e))
        .then(() => Promise.all([
            db.collection('inventory').get(),
            db.collection('transactions').get()
        ])).then(([invSnap, txSnap]) => {
        const rows = {};        // businessMaterialId -> row
        const docToBiz = {};    // firestore doc id   -> businessMaterialId
        const nameToBiz = {};   // material name      -> businessMaterialId (null if ambiguous)

        invSnap.forEach(doc => {
            const d = doc.data();
            const biz = d.materialId || doc.id;
            docToBiz[doc.id] = biz;
            if (!rows[biz]) rows[biz] = newReportRow(biz, d.materialName, d.category, normalizeUom(d.uom));
            const r = rows[biz];
            r.currentStock += Number(d.currentStock) || 0;      // consolidated live stock
            r.reorderLevel = Number(d.reorderLevel) || r.reorderLevel;
            if (d.status === 'rejected') r.rejected = true;

            const nk = (d.materialName || '').toLowerCase();
            if (nk) nameToBiz[nk] = (nk in nameToBiz && nameToBiz[nk] !== biz) ? null : biz;
        });

        txSnap.forEach(doc => {
            const t = doc.data();
            const type = (t.type || '').toUpperCase();
            let group = null;
            Object.keys(TX_GROUPS).forEach(g => { if (TX_GROUPS[g].indexOf(type) !== -1) group = g; });
            if (!group) return;                                   // UPDATE etc. do not move stock

            const qty = Number(t.quantity) || 0;
            if (!qty) return;

            // find which material this transaction belongs to
            const raw = t.materialId;
            let biz = null;
            if (raw && rows[raw]) biz = raw;
            else if (raw && docToBiz[raw]) biz = docToBiz[raw];                       // old entries stored doc id
            else if (t.inventoryDocId && docToBiz[t.inventoryDocId]) biz = docToBiz[t.inventoryDocId];
            else if (t.materialName && nameToBiz[t.materialName.toLowerCase()]) biz = nameToBiz[t.materialName.toLowerCase()];

            if (!biz) {                                           // material deleted / merged after the movement
                biz = 'REMOVED:' + (raw || t.materialName || '?');
                if (!rows[biz]) {
                    rows[biz] = newReportRow('(removed)', t.materialName, t.category, t.uom);
                    rows[biz].removed = true;
                }
            }

            const r = rows[biz];
            const effect = (group === 'received' || group === 'adjusted') ? qty : -qty;
            const when = txToDate(t);

            if (startDate && when && when < startDate) { r.opening += effect; return; }   // before period
            if (endDate && when && when > endDate) return;                                  // after period
            r[group] += qty;
        });

        const upToNow = !endDate || endDate >= new Date();
        let list = Object.keys(rows).map(k => {
            const r = rows[k];
            r.balance = r.opening + r.received - r.used - r.dispatched - r.returned + r.adjusted;
            r.mismatch = upToNow && !r.removed && Math.abs(r.balance - r.currentStock) > 0.0001;
            r.status = r.removed ? 'Removed' : (r.rejected ? 'rejected' : getMaterialStatus({ currentStock: r.currentStock, reorderLevel: r.reorderLevel }));
            return r;
        });

        // materials that were deleted from inventory are not shown in reports
        list = list.filter(r => !r.removed);
        if (selectedId) list = list.filter(r => r.materialId === selectedId);
        if (selectedCat) list = list.filter(r => r.category === selectedCat);
        list.sort((a, b) => (a.category + a.materialId).localeCompare(b.category + b.materialId));

        filteredReportData = list;
        totalReportItems = list.length;
        currentReportPage = 1;
        renderReportTable();
    }).catch(error => {
        console.error('Error generating report:', error);
        table.innerHTML = '<tr><td colspan="12" class="text-center text-danger">Error generating report</td></tr>';
    });
}

// Render report table with pagination
function renderReportTable() {
    const reportTable = document.getElementById('materialReportTable');

    if (filteredReportData.length === 0) {
        reportTable.innerHTML = '<tr><td colspan="12" class="text-center">No data found for the selected criteria</td></tr>';
        updateReportPagination();
        return;
    }

    const startIndex = (currentReportPage - 1) * reportsPerPage;
    const endIndex = Math.min(startIndex + reportsPerPage, filteredReportData.length);
    let html = '';

    for (let i = startIndex; i < endIndex; i++) {
        const item = filteredReportData[i];

        let statusBadge;
        if (item.status === 'Available') statusBadge = '<span class="badge bg-success">Available</span>';
        else if (item.status === 'Low Stock') statusBadge = '<span class="badge bg-warning">Low Stock</span>';
        else if (item.status === 'Out of Stock') statusBadge = '<span class="badge bg-danger">Out of Stock</span>';
        else if (item.status === 'rejected') statusBadge = '<span class="badge bg-secondary">Rejected</span>';
        else statusBadge = `<span class="badge bg-info">${item.status}</span>`;

        let categoryBadge;
        if (item.category === 'RM') categoryBadge = '<span class="category-badge badge-rm">RM</span>';
        else if (item.category === 'FG') categoryBadge = '<span class="category-badge badge-fg">FG</span>';
        else if (item.category === 'CONSUMABLE') categoryBadge = '<span class="category-badge badge-consumable">Consumable</span>';
        else categoryBadge = `<span class="category-badge">${item.category}</span>`;

        const warn = item.mismatch
            ? ' <i class="fas fa-exclamation-triangle text-warning" title="Ledger closing balance differs from live stock (earlier manual edits or old wrong return entries)"></i>'
            : '';
        const adj = item.adjusted > 0 ? '+' + formatToZeroDecimal(item.adjusted) : formatToZeroDecimal(item.adjusted);

        html += `
            <tr>
                <td><strong>${item.materialId}</strong></td>
                <td>${item.materialName}${item.uom ? ' <small class="text-muted">(' + item.uom + ')</small>' : ''}</td>
                <td>${categoryBadge}</td>
                <td>${formatToZeroDecimal(item.opening)}</td>
                <td class="text-success fw-bold">${formatToZeroDecimal(item.received)}</td>
                <td class="text-info fw-bold">${formatToZeroDecimal(item.used)}</td>
                <td class="text-danger fw-bold">${formatToZeroDecimal(item.dispatched)}</td>
                <td class="text-warning fw-bold">${formatToZeroDecimal(item.returned)}</td>
                <td>${adj}</td>
                <td class="text-primary fw-bold">${formatToZeroDecimal(item.balance)}</td>
                <td>${formatToZeroDecimal(item.currentStock)}${warn}</td>
                <td>${statusBadge}</td>
            </tr>
        `;
    }

    reportTable.innerHTML = html;
    updateReportPagination();
}

// Export report to CSV
function exportReport() {
    if (filteredReportData.length === 0) {
        alert('No data to export!');
        return;
    }
    const q = v => `"${String(v === undefined || v === null ? '' : v).replace(/"/g, '""')}"`;
    let csv = "Material ID,Material Name,Category,UOM,Opening,Received,Used/Issued,Dispatched,Returned,Adjustment,Closing Balance,Current Stock,Status\n";
    filteredReportData.forEach(r => {
        csv += [q(r.materialId), q(r.materialName), q(r.category), q(r.uom), r.opening, r.received, r.used,
                r.dispatched, r.returned, r.adjusted, r.balance, r.currentStock, q(r.status)].join(',') + "\n";
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.setAttribute('hidden', '');
    a.setAttribute('href', url);
    a.setAttribute('download', `material_report_${new Date().toISOString().split('T')[0]}.csv`);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// ------------------------------------------------------------
// FG coming from QC -> Store counts as RECEIVED.
// The QC dashboard adds approved FG straight into 'inventory' without a
// transaction, so we log one RECEIVE entry per approved QC record here.
// Document id is fixed (QCRCV-<qcId>) so it can never be logged twice.
// ------------------------------------------------------------
function logApprovedQCReceipts() {
    return Promise.all([
        db.collection('qc_records').where('finalStatus', '==', 'approved').get(),
        db.collection('transactions').where('source', '==', 'QC_APPROVED').get()
    ]).then(([qcSnap, txSnap]) => {
        const logged = new Set();
        txSnap.forEach(d => logged.add(d.data().qcRecordId));

        const writes = [];
        qcSnap.forEach(doc => {
            const q = doc.data();
            const qcId = q.qcId || doc.id;
            const qty = Number(q.productionQuantity) || 0;
            if (logged.has(qcId) || !qty || !q.materialId) return;

            const ts = q.finalMoveDate || q.qcDate;
            const when = (ts && typeof ts.toDate === 'function') ? ts.toDate() : new Date();

            writes.push(db.collection('transactions').doc('QCRCV-' + qcId).set({
                materialId: q.materialId,
                inventoryDocId: null,
                materialName: (q.materialName || '').trim(),
                category: q.inventoryCategory || 'FG',
                uom: q.uom || '',
                type: 'RECEIVE',
                quantity: qty,
                remarks: `FG received from QC ${qcId} (Job: ${q.productionJobId || q.jobId || '-'}, Order: ${q.orderId || '-'})`,
                user: q.finalMoveBy || q.inspector || 'Quality',
                source: 'QC_APPROVED',
                qcRecordId: qcId,
                timestamp: firebase.firestore.Timestamp.fromDate(when),
                date: when
            }));
        });
        return Promise.all(writes);
    });
}

// Make every inventory row use the master UOM list (e.g. old "kgs" -> "kg").
function normalizeInventoryUom() {
    return db.collection('inventory').get().then(snap => {
        const batch = db.batch();
        let n = 0;
        snap.forEach(doc => {
            const u = doc.data().uom;
            const c = normalizeUom(u);
            if (u && c !== u && UOM_MASTER.indexOf(c) !== -1 && n < 400) {
                batch.update(doc.ref, { uom: c });
                n++;
            }
        });
        if (n > 0) {
            return batch.commit().then(() => console.log('Inventory UOM standardised on ' + n + ' item(s)'));
        }
    });
}

// ============================================================
// MATERIAL ISSUE APPROVAL  (Production requests -> Store approves)
// Stock is reduced ONLY here, when the store person approves.
// ============================================================
let issueListCache = {};
let issueApproveBusy = false;

function escHtml(v) {
    return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function watchPendingIssues() {
    db.collection('material_issues').where('status', '==', 'pending').onSnapshot(snap => {
        const el = document.getElementById('issuesBadge');
        if (el) {
            el.textContent = snap.size;
            el.style.display = snap.size ? 'inline-block' : 'none';
        }
        const mod = document.getElementById('issuesModule');
        if (mod && mod.classList.contains('active')) loadMaterialIssues();
    }, err => console.error('Issue watcher error:', err));
}

function loadMaterialIssues() {
    const body = document.getElementById('issuesTableBody');
    const filter = document.getElementById('issueStatusFilter').value;
    body.innerHTML = '<tr><td colspan="8" class="text-center">Loading...</td></tr>';

    db.collection('material_issues').get().then(snap => {
        let list = [];
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
        issueListCache = {};
        list.forEach(i => { issueListCache[i.id] = i; });
        if (filter) list = list.filter(i => i.status === filter);
        const ms = x => (x && typeof x.toMillis === 'function') ? x.toMillis() : 0;
        list.sort((a, b) => ms(b.requestedDate) - ms(a.requestedDate));

        if (!list.length) {
            body.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No issue requests found</td></tr>';
            return;
        }
        body.innerHTML = list.map(i => {
            const when = (i.requestedDate && i.requestedDate.toDate) ? i.requestedDate.toDate().toLocaleString() : '-';
            let badge = '<span class="badge bg-warning text-dark">Pending</span>';
            if (i.status === 'approved') badge = '<span class="badge bg-success">Issued</span>';
            if (i.status === 'rejected') badge = '<span class="badge bg-danger">Rejected</span>';
            const btn = i.status === 'pending'
                ? `<button class="btn btn-sm btn-primary" onclick="openIssueReview('${i.id}')"><i class="fas fa-clipboard-check me-1"></i>Review</button>`
                : `<button class="btn btn-sm btn-outline-secondary" onclick="openIssueReview('${i.id}')">View</button>`;
            return `<tr>
                <td><strong>${escHtml(i.issueId)}</strong></td>
                <td>${escHtml(when)}</td>
                <td>${escHtml(i.orderId || '-')}</td>
                <td>${escHtml(i.machine || '-')}</td>
                <td>${escHtml(i.fgProductName || i.fgProductId || '-')}</td>
                <td>${(i.items || []).length} item(s)</td>
                <td>${badge}</td>
                <td>${btn}</td>
            </tr>`;
        }).join('');
    }).catch(err => {
        console.error(err);
        body.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error loading requests</td></tr>';
    });
}

function openIssueReview(issueId) {
    const issue = issueListCache[issueId];
    if (!issue) return;
    const items = issue.items || [];

    Promise.all(items.map(it => db.collection('inventory').where('materialId', '==', it.materialId).get()))
        .then(snaps => {
            const pending = issue.status === 'pending';
            const rows = items.map((it, idx) => {
                let stock = 0, uom = it.uom;
                snaps[idx].forEach(d => {
                    stock += Number(d.data().currentStock) || 0;
                    if (d.data().uom) uom = d.data().uom;
                });
                uom = normalizeUom(uom);
                const required = Number(it.requiredQty) || 0;
                const short = stock < required;
                const input = pending
                    ? `<input type="number" class="form-control form-control-sm" id="issueQty_${idx}" min="0" step="any" value="${Math.min(required, stock)}" style="max-width:130px">`
                    : escHtml(it.issuedQty !== undefined ? it.issuedQty : '-');
                return `<tr>
                    <td>${escHtml(it.materialId)}</td>
                    <td>${escHtml(it.materialName)}</td>
                    <td>${required} ${escHtml(uom)}</td>
                    <td class="${short ? 'text-danger fw-bold' : ''}">${stock} ${escHtml(uom)}${short ? ' (short)' : ''}</td>
                    <td>${input}</td>
                </tr>`;
            }).join('');

            const footer = pending
                ? `<button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                   <button class="btn btn-outline-danger" onclick="rejectMaterialIssue('${issueId}')"><i class="fas fa-times me-1"></i>Reject</button>
                   <button class="btn btn-success" onclick="approveMaterialIssue('${issueId}')"><i class="fas fa-check me-1"></i>Approve &amp; Issue</button>`
                : `<button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>`;

            const info = !pending
                ? `<div class="alert alert-light border mb-3"><strong>${escHtml((issue.status || '').toUpperCase())}</strong>
                   ${issue.approvedBy ? ' by ' + escHtml(issue.approvedBy) : ''}${issue.rejectedBy ? ' by ' + escHtml(issue.rejectedBy) : ''}
                   ${issue.storeRemarks ? '<br>' + escHtml(issue.storeRemarks) : ''}</div>` : '';

            const html = `
            <div class="modal fade" id="issueReviewModal" tabindex="-1">
              <div class="modal-dialog modal-lg"><div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Material Issue ${escHtml(issue.issueId)}</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                  <div class="row mb-3">
                    <div class="col-md-4"><strong>Order:</strong> ${escHtml(issue.orderId || '-')}</div>
                    <div class="col-md-4"><strong>Machine:</strong> ${escHtml(issue.machine || '-')}</div>
                    <div class="col-md-4"><strong>Requested by:</strong> ${escHtml(issue.requestedBy || '-')}</div>
                    <div class="col-md-8 mt-2"><strong>Product:</strong> ${escHtml(issue.fgProductName || issue.fgProductId || '-')} (${escHtml(issue.orderQuantity || '')})</div>
                    <div class="col-md-4 mt-2"><strong>BOM:</strong> ${escHtml(issue.bomId || '-')}</div>
                  </div>
                  ${info}
                  <div class="table-responsive"><table class="table table-sm table-bordered">
                    <thead><tr><th>Material ID</th><th>Material</th><th>Required</th><th>Store Stock</th><th>${pending ? 'Issue Qty' : 'Issued Qty'}</th></tr></thead>
                    <tbody>${rows}</tbody></table></div>
                  ${pending ? '<label class="form-label">Remarks (optional)</label><input type="text" class="form-control" id="issueStoreRemarks">' : ''}
                </div>
                <div class="modal-footer">${footer}</div>
              </div></div>
            </div>`;

            const old = document.getElementById('issueReviewModal');
            if (old) old.remove();
            document.body.insertAdjacentHTML('beforeend', html);
            new bootstrap.Modal(document.getElementById('issueReviewModal')).show();
        })
        .catch(err => { console.error(err); alert('Could not load stock for this request'); });
}

function approveMaterialIssue(issueId) {
    if (issueApproveBusy) return;
    const issue = issueListCache[issueId];
    if (!issue) return;
    const items = issue.items || [];
    const user = currentUser.textContent;
    const remarks = (document.getElementById('issueStoreRemarks') || {}).value || '';

    const qtys = items.map((it, idx) => parseFloat(document.getElementById('issueQty_' + idx).value) || 0);
    if (qtys.some(q => q < 0)) { alert('Issue quantity cannot be negative'); return; }
    const lessThanRequired = items.some((it, idx) => qtys[idx] < (Number(it.requiredQty) || 0));
    if (lessThanRequired && !confirm('Some items are being issued LESS than the BOM requirement. Continue?')) return;

    issueApproveBusy = true;
    let logs = [];

    db.collection('material_issues').doc(issueId).get()
        .then(fresh => {
            if (!fresh.exists || fresh.data().status !== 'pending') throw new Error('This request is no longer pending.');
            return Promise.all(items.map(it => db.collection('inventory').where('materialId', '==', it.materialId).get()));
        })
        .then(snaps => {
            const batch = db.batch();
            const issuedItems = [];

            items.forEach((it, idx) => {
                const qty = qtys[idx];
                const entries = snaps[idx].docs.map(d => ({ ref: d.ref, id: d.id, data: d.data(), stock: Number(d.data().currentStock) || 0 }));
                if (!entries.length) throw new Error(`Material ${it.materialId} not found in inventory`);
                const total = entries.reduce((s, e) => s + e.stock, 0);
                if (qty > total + 1e-9) throw new Error(`Insufficient stock for ${it.materialName}: issue ${qty}, available ${total}`);

                let remaining = qty;
                entries.forEach(e => {
                    if (remaining <= 0 || e.stock <= 0) return;
                    const take = Math.min(e.stock, remaining);
                    const newStock = e.stock - take;
                    remaining -= take;
                    const reorder = Number(e.data.reorderLevel) || 0;
                    const upd = { currentStock: newStock, lastUpdated: firebase.firestore.FieldValue.serverTimestamp() };
                    if (e.data.status !== 'rejected') {
                        upd.status = newStock <= 0 ? 'Out of Stock' : (newStock <= reorder ? 'Low Stock' : 'Available');
                    }
                    batch.update(e.ref, upd);
                });

                const uom = normalizeUom(entries[0].data.uom || it.uom);
                issuedItems.push({ ...it, uom: uom, issuedQty: qty });
                logs.push({ it, qty, docId: entries[0].id, base: entries[0].data });
            });

            batch.update(db.collection('material_issues').doc(issueId), {
                status: 'approved',
                items: issuedItems,
                approvedBy: user,
                approvedDate: firebase.firestore.FieldValue.serverTimestamp(),
                storeRemarks: remarks
            });
            batch.update(db.collection('allocations').doc(issue.allocationId), {
                materialAvailable: true,
                materialAvailableDate: firebase.firestore.FieldValue.serverTimestamp(),
                materialAvailableBy: user,
                issueStatus: 'issued'
            });
            return batch.commit();
        })
        .then(() => Promise.all(logs.filter(l => l.qty > 0).map(l =>
            recordTransaction('ISSUE', l.docId, l.it.materialName, l.qty,
                `Issued to production: ${issue.issueId} (Order ${issue.orderId || '-'}, ${issue.machine || '-'})`,
                { businessId: l.it.materialId, category: l.base.category, uom: normalizeUom(l.base.uom || l.it.uom) })
        )))
        .then(() => {
            const m = bootstrap.Modal.getInstance(document.getElementById('issueReviewModal'));
            if (m) m.hide();
            alert('Materials issued to production. Stock has been reduced.');
            loadMaterialIssues();
            loadInventory();
        })
        .catch(err => {
            console.error('Approve issue failed:', err);
            alert(err && err.message ? err.message : 'Error approving issue');
        })
        .finally(() => { issueApproveBusy = false; });
}

function rejectMaterialIssue(issueId) {
    const issue = issueListCache[issueId];
    if (!issue) return;
    const reason = prompt('Reason for rejecting this issue request:');
    if (reason === null) return;
    if (!reason.trim()) { alert('Please enter a reason'); return; }
    const user = currentUser.textContent;

    const batch = db.batch();
    batch.update(db.collection('material_issues').doc(issueId), {
        status: 'rejected',
        rejectedBy: user,
        rejectedDate: firebase.firestore.FieldValue.serverTimestamp(),
        storeRemarks: reason.trim()
    });
    batch.update(db.collection('allocations').doc(issue.allocationId), {
        materialAvailable: false,
        issueStatus: 'rejected',
        issueRejectReason: reason.trim()
    });
    batch.commit().then(() => {
        const m = bootstrap.Modal.getInstance(document.getElementById('issueReviewModal'));
        if (m) m.hide();
        loadMaterialIssues();
    }).catch(err => { console.error(err); alert('Error rejecting request'); });
}

function getMaterialStatus(materialData) {
    const currentStock = parseFloat(materialData.currentStock) || 0;
    const reorderLevel = parseFloat(materialData.reorderLevel) || 0;
    
    if (currentStock <= 0) return 'Out of Stock';
    if (currentStock <= reorderLevel) return 'Low Stock';
    return 'Available';
}

// Render report table with pagination and zero decimal formatting

// Helper function to format numbers to zero decimals
function formatToZeroDecimal(number) {
    // Handle null, undefined, or non-numeric values
    if (number === null || number === undefined || isNaN(number)) {
        return '0';
    }
    
    // Convert to number and format to zero decimals
    return parseInt(number).toLocaleString('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
    });
}

// Also update the export function to use zero decimals

// Helper function for export (without thousand separators)
function formatToZeroDecimalExport(number) {
    if (number === null || number === undefined || isNaN(number)) {
        return '0';
    }
    return parseInt(number);
}

                const row = document.createElement('tr');

// Pagination variables for transactions
let currentTransactionPage = 1;
const transactionsPerPage = 10;
let filteredTransactions = [];
let totalTransactions = 0;

// Load transactions with pagination
function loadTransactions() {
    const dateFrom = document.getElementById('filterDateFrom').value;
    const dateTo = document.getElementById('filterDateTo').value;
    const typeFilter = document.getElementById('filterTransactionType').value;
    
    const transactionsBody = document.getElementById('transactionsTableBody');
    transactionsBody.innerHTML = '<tr><td colspan="7" class="text-center">Loading...</td></tr>';
    
    let query = db.collection('transactions').orderBy('timestamp', 'desc');
    
    // Apply filters if provided
    if (dateFrom) {
        const fromDate = new Date(dateFrom);
        query = query.where('timestamp', '>=', fromDate);
    }
    
    if (dateTo) {
        const toDate = new Date(dateTo);
        toDate.setHours(23, 59, 59, 999);
        query = query.where('timestamp', '<=', toDate);
    }
    
    if (typeFilter) {
        query = query.where('type', '==', typeFilter);
    }
    
    query.get().then(snapshot => {
        filteredTransactions = [];
        
        snapshot.forEach(doc => {
            filteredTransactions.push({
                id: doc.id,
                ...doc.data()
            });
        });
        
        totalTransactions = filteredTransactions.length;
        currentTransactionPage = 1;
        renderTransactionsTable();
        
    }).catch(error => {
        console.error('Error loading transactions:', error);
        transactionsBody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Error loading transactions</td></tr>';
    });
}

// Render transactions table with pagination
function renderTransactionsTable() {
    const transactionsBody = document.getElementById('transactionsTableBody');
    
    if (filteredTransactions.length === 0) {
        transactionsBody.innerHTML = '<tr><td colspan="7" class="text-center">No transactions found</td></tr>';
        updateTransactionPagination();
        return;
    }
    
    let html = '';
    const startIndex = (currentTransactionPage - 1) * transactionsPerPage;
    const endIndex = Math.min(startIndex + transactionsPerPage, filteredTransactions.length);
    
    for (let i = startIndex; i < endIndex; i++) {
        const transaction = filteredTransactions[i];
        
        // Format date safely
        let formattedDate = 'Unknown Date';
        if (transaction.timestamp && typeof transaction.timestamp.toDate === 'function') {
            formattedDate = transaction.timestamp.toDate().toLocaleString();
        } else if (transaction.timestamp) {
            formattedDate = new Date(transaction.timestamp).toLocaleString();
        } else if (transaction.date) {
            formattedDate = new Date(transaction.date).toLocaleString();
        }
        
        // Determine badge color based on transaction type
        let badgeClass = 'bg-secondary';
        switch(transaction.type) {
            case 'ADD': badgeClass = 'bg-primary'; break;
            case 'RECEIVE': badgeClass = 'bg-success'; break;
            case 'DISPATCH': badgeClass = 'bg-info'; break;
            case 'ISSUE': badgeClass = 'bg-primary'; break;
            case 'RETURN': badgeClass = 'bg-warning'; break;
            case 'REJECTED_QC': badgeClass = 'bg-danger'; break;
        }
        
        html += `
            <tr>
                <td>${formattedDate}</td>
                <td><small class="text-muted">${transaction.id.substring(0, 8)}...</small></td>
                <td>${transaction.materialName || 'Unknown Material'}</td>
                <td><span class="badge ${badgeClass}">${transaction.type}</span></td>
                <td>${transaction.quantity || 0}</td>
                <td>${transaction.remarks || '-'}</td>
                <td>${transaction.user || 'System'}</td>
            </tr>
        `;
    }
    
    transactionsBody.innerHTML = html;
    updateTransactionPagination();
}

// Add to setupEventListeners function
document.getElementById('filterTransactionsBtn').addEventListener('click', loadTransactions);
    // Record transaction
    // materialId passed in may be a Firestore doc id OR the business materialId.
    // We always store the BUSINESS materialId (so reports can match it) + the doc id.
    function recordTransaction(type, materialId, materialName, quantity, remarks, meta) {
        meta = meta || {};
        const write = (bizId, category, uom, docId) => {
            return db.collection('transactions').add({
                materialId: bizId,
                inventoryDocId: docId || null,
                materialName: materialName || '',
                category: category || '',
                uom: uom || '',
                type: type,
                quantity: Number(quantity) || 0,
                remarks: remarks || '',
                user: currentUser.textContent,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                date: new Date()
            }).catch(error => {
                console.error('Error recording transaction: ', error);
            });
        };

        if (meta.businessId) {
            return write(meta.businessId, meta.category, meta.uom, String(materialId));
        }
        try {
            return db.collection('inventory').doc(String(materialId)).get()
                .then(doc => {
                    if (doc.exists) {
                        const d = doc.data();
                        return write(d.materialId || materialId, d.category, d.uom, doc.id);
                    }
                    return write(materialId, meta.category, meta.uom, null);
                })
                .catch(() => write(materialId, meta.category, meta.uom, null));
        } catch (e) {
            return write(materialId, meta.category, meta.uom, null);
        }
    }

    // Function to add rejected materials from QC to inventory
    function addRejectedMaterialFromQC(qcData) {
        // Generate a unique material ID for the rejected material
        const rejectedMaterialId = `REJ-${qcData.materialId}-${Date.now()}`;
        
        const materialData = {
            materialId: rejectedMaterialId,
            materialName: `${qcData.materialName} (Rejected)`,
            category: qcData.inventoryCategory || 'FG',
            description: `Rejected material from QC ${qcData.qcId}. ${qcData.remarks || ''}`,
            uom: qcData.uom || 'kgs',
            currentStock: qcData.productionQuantity || 0,
            reorderLevel: 0,
            lastInvoice: `QC-${qcData.qcId}`,
            lastArrivalDate: new Date().toISOString().split('T')[0],
            storeLocation: 'Rejected Materials Area',
            storeIncharge: qcData.inspector || 'Quality Inspector',
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
            qcReference: qcData.qcId,
            jobReference: qcData.jobId,
            status: 'rejected',
            originalMaterialId: qcData.materialId,
            originalMaterialName: qcData.materialName,
            rejectionDate: firebase.firestore.FieldValue.serverTimestamp()
        };

        // Add to inventory
        return db.collection('inventory').add(materialData)
            .then(() => {
                // Record transaction
                recordTransaction('REJECTED_QC', rejectedMaterialId, materialData.materialName, 
                                qcData.productionQuantity, 
                                `Material rejected from QC ${qcData.qcId}. ${qcData.remarks || ''}`);
                
                console.log('Rejected material added to inventory:', rejectedMaterialId);
                return rejectedMaterialId;
            })
            .catch(error => {
                console.error('Error adding rejected material: ', error);
                throw error;
            });
    }

    // Function to automatically process QC rejections
    function processQCRejections() {
        console.log('Checking for QC rejections...');
        
        db.collection('qcRecords')
            .where('status', '==', 'rejected')
            .where('processedToInventory', '==', false)
            .get()
            .then(snapshot => {
                if (snapshot.empty) {
                    console.log('No unprocessed rejected QC records found');
                    return;
                }
                
                console.log(`Found ${snapshot.size} rejected QC records to process`);
                
                const processPromises = [];
                
                snapshot.forEach(doc => {
                    const qcData = doc.data();
                    console.log('Processing rejected QC:', qcData.qcId);
                    
                    // Process this rejected QC record
                    const processPromise = addRejectedMaterialFromQC(qcData)
                        .then(() => {
                            // Mark as processed
                            return db.collection('qcRecords').doc(doc.id).update({
                                processedToInventory: true,
                                inventoryAddedDate: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        })
                        .catch(error => {
                            console.error(`Failed to process QC ${qcData.qcId}:`, error);
                        });
                    
                    processPromises.push(processPromise);
                });
                
                return Promise.all(processPromises);
            })
            .then(() => {
                console.log('QC rejection processing completed');
                // Refresh inventory if we're on the inventory page
                if (inventoryModule.classList.contains('active')) {
                    loadInventory();
                }
                loadDashboardData(); // Refresh dashboard stats
            })
            .catch(error => {
                console.error('Error processing QC rejections:', error);
            });
    }

// Load FG products for BOM creation - FIXED VERSION
function loadFGProductsForBOM() {
    const fgProductIdSelect = document.getElementById('fgProductId');
    
    // Use simple query without composite index
    db.collection('inventory')
        .orderBy('materialId')
        .get()
        .then(snapshot => {
            fgProductIdSelect.innerHTML = '<option value="">Select FG Product</option>';
            
            if (snapshot.empty) {
                console.log('No products found in inventory');
                const option = document.createElement('option');
                option.value = "";
                option.textContent = "No products found in inventory";
                option.disabled = true;
                fgProductIdSelect.appendChild(option);
                return;
            }
            
            let hasFGProducts = false;
            
            snapshot.forEach(doc => {
                const material = doc.data();
                console.log('Found product:', material.materialId, material.materialName, material.category);
                
                // Client-side filtering for FG products
                if (material.category === 'FG') {
                    const option = document.createElement('option');
                    option.value = material.materialId;
                    option.textContent = `${material.materialId} - ${material.materialName}`;
                    option.setAttribute('data-name', material.materialName);
                    fgProductIdSelect.appendChild(option);
                    hasFGProducts = true;
                }
            });
            
            if (!hasFGProducts) {
                console.log('No FG products found. Showing all products for selection.');
                // If no FG products, show all products with their categories
                snapshot.forEach(doc => {
                    const material = doc.data();
                    const option = document.createElement('option');
                    option.value = material.materialId;
                    option.textContent = `${material.materialId} - ${material.materialName} (${material.category || 'No Category'})`;
                    option.setAttribute('data-name', material.materialName);
                    fgProductIdSelect.appendChild(option);
                });
            }
        })
        .catch(error => {
            console.error('Error loading FG products:', error);
            // Fallback: Try without ordering
            db.collection('inventory').get()
                .then(snapshot => {
                    fgProductIdSelect.innerHTML = '<option value="">Select FG Product</option>';
                    snapshot.forEach(doc => {
                        const material = doc.data();
                        const option = document.createElement('option');
                        option.value = material.materialId;
                        option.textContent = `${material.materialId} - ${material.materialName}`;
                        option.setAttribute('data-name', material.materialName);
                        fgProductIdSelect.appendChild(option);
                    });
                })
                .catch(fallbackError => {
                    console.error('Fallback also failed:', fallbackError);
                });
        });
}

// Load material dropdown for BOM components - FIXED VERSION
function loadMaterialDropdownForBOM() {
    const materialSelects = document.querySelectorAll('.bom-material');
    
    // Use simple query without composite index
    db.collection('inventory')
        .orderBy('materialId')
        .get()
        .then(snapshot => {
            materialSelects.forEach(select => {
                select.innerHTML = '<option value="">Select Material</option>';
                
                if (snapshot.empty) {
                    console.log('No materials found in inventory');
                    const option = document.createElement('option');
                    option.value = "";
                    option.textContent = "No materials found";
                    option.disabled = true;
                    select.appendChild(option);
                    return;
                }
                
                let hasMaterials = false;
                
                snapshot.forEach(doc => {
                    const material = doc.data();
                    
                    // Client-side filtering for RM and CONSUMABLE materials
                    if (material.category === 'RM' || material.category === 'CONSUMABLE') {
                        const option = document.createElement('option');
                        option.value = material.materialId;
                        option.textContent = `${material.materialId} - ${material.materialName}`;
                        option.setAttribute('data-uom', material.uom || '');
                        option.setAttribute('data-name', material.materialName);
                        select.appendChild(option);
                        hasMaterials = true;
                    }
                });
                
                if (!hasMaterials) {
                    console.log('No RM/CONSUMABLE materials found. Showing all materials.');
                    // If no specific materials, show all with categories
                    snapshot.forEach(doc => {
                        const material = doc.data();
                        const option = document.createElement('option');
                        option.value = material.materialId;
                        option.textContent = `${material.materialId} - ${material.materialName} (${material.category || 'No Category'})`;
                        option.setAttribute('data-uom', material.uom || '');
                        option.setAttribute('data-name', material.materialName);
                        select.appendChild(option);
                    });
                }
            });
            
            // Add event listeners to material selects
            document.querySelectorAll('.bom-material').forEach(select => {
                select.addEventListener('change', function() {
                    const selectedOption = this.options[this.selectedIndex];
                    const uom = selectedOption.getAttribute('data-uom') || '';
                    this.closest('.bom-item').querySelector('.bom-uom').value = uom;
                });
            });
            
            // Add event listeners to remove buttons
            document.querySelectorAll('.remove-component').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (document.querySelectorAll('.bom-item').length > 1) {
                        this.closest('.bom-item').remove();
                    } else {
                        alert('BOM must have at least one component');
                    }
                });
            });
        })
        .catch(error => {
            console.error('Error loading materials:', error);
            // Fallback: Try without ordering
            db.collection('inventory').get()
                .then(snapshot => {
                    materialSelects.forEach(select => {
                        select.innerHTML = '<option value="">Select Material</option>';
                        snapshot.forEach(doc => {
                            const material = doc.data();
                            const option = document.createElement('option');
                            option.value = material.materialId;
                            option.textContent = `${material.materialId} - ${material.materialName}`;

                            select.appendChild(option);
                        });
                    });
                })
                .catch(fallbackError => {
                    console.error('Fallback also failed:', fallbackError);
                });
        });
}

        // Update material requirements based on BOM and order quantity
        function updateMaterialRequirements() {
            const bomId = document.getElementById('bomSelect').value;
            const orderQuantity = parseInt(document.getElementById('orderQuantity').value) || 0;
            const requirementsDiv = document.getElementById('materialRequirements');
            
            if (!bomId || orderQuantity <= 0) {
                requirementsDiv.innerHTML = '<p class="text-muted">Select a BOM and enter order quantity to see material requirements</p>';

            // Get BOM details
            db.collection('boms').doc(bomId).get().then(doc => {

                    const bom = doc.data();
                    let html = `<h6>Materials required for ${orderQuantity} units of ${bom.fgProductName}:</h6>`;
                    html += '<div class="table-responsive"><table class="table table-sm"><thead><tr><th>Material</th><th>Quantity per Unit</th><th>Total Required</th><th>UOM</th><th>Stock Status</th></tr></thead><tbody>';
                    
                    // Check stock for each component
                    const stockPromises = bom.components.map(component => {
                        return db.collection('inventory')
                            .where('materialId', '==', component.materialId)
                            .get()
                            .then(snapshot => {
                                let stock = 0;
                                if (!snapshot.empty) {
                                    snapshot.forEach(doc => {
                                        stock += Number(doc.data().currentStock) || 0;
                                    });
                                }
                                return {
                                    component: component,
                                    stock: stock,
                                    totalRequired: component.quantity * orderQuantity
                                };
                            });
                    });
                    
                    Promise.all(stockPromises).then(results => {
                        results.forEach(result => {
                            const status = result.stock >= result.totalRequired ? 
                                '<span class="badge bg-success">In Stock</span>' : 
                                '<span class="badge bg-danger">Insufficient</span>';
                            
                            html += `
                                <tr>
                                    <td>${result.component.materialName}</td>
                                    <td>${result.component.quantity}</td>
                                    <td>${result.totalRequired.toFixed(2)}</td>
                                    <td>${normalizeUom(result.component.uom)}</td>
                                    <td>${status}</td>
                                </tr>
                            `;
                        });
                        
                        html += '</tbody></table></div>';
                        requirementsDiv.innerHTML = html;
                    });
                }
            });
        }

        // Allocate stock to production based on BOM
        function allocateStock(e) {
            e.preventDefault();
            
            const orderId = document.getElementById('orderId').value;
            const bomId = document.getElementById('bomSelect').value;
            const orderQuantity = parseInt(document.getElementById('orderQuantity').value);
            const customer = document.getElementById('allocateCustomer').value;
            const machine = document.getElementById('allocateMachine').value;
            const remarks = document.getElementById('allocateRemarks').value;
            
            if (!orderId || !bomId || !orderQuantity || !customer || !machine) {
                alert('Please fill all required fields');
                return;
            }
            
            db.collection('boms').doc(bomId).get().then(doc => {
                if (!doc.exists) {
                    alert('BOM not found');
                    return;
                }
                
                const bom = doc.data();
                const components = bom.components || [];
                if (!components.length) {
                    alert('This BOM has no materials defined');
                    return;
                }
                const allocationId = 'ALLOC-' + Date.now();
                const user = localStorage.getItem('username') || localStorage.getItem('userEmail') || 'Production Planner';
                
                // Stock already promised to other allocations that the store has not issued yet
                const reservedPromise = db.collection('allocations').where('status', '==', 'active').get().then(snap => {
                    const reserved = {};
                    snap.forEach(a => {
                        const d = a.data();
                        if (d.issueFlow === 'store_approval' && d.materialAvailable !== true && Array.isArray(d.components)) {
                            d.components.forEach(c => {
                                reserved[c.materialId] = (reserved[c.materialId] || 0) + (Number(c.requiredQty) || 0);
                            });
                        }
                    });
                    return reserved;
                });
                
                // FG unit of measure comes from the Store inventory (single source of truth)
                const fgUomPromise = db.collection('inventory').where('materialId', '==', bom.fgProductId).get().then(snap => {
                    let u = '';
                    snap.forEach(d => { if (!u && d.data().uom) u = d.data().uom; });
                    return normalizeUom(u) || 'kg';
                });
                
                Promise.all([reservedPromise, fgUomPromise]).then(([reserved, fgUom]) => {
                    const checks = components.map(component => {
                        return db.collection('inventory')
                            .where('materialId', '==', component.materialId)
                            .get()
                            .then(snapshot => {
                                if (snapshot.empty) {
                                    throw new Error(`Material ${component.materialId} not found in inventory`);
                                }
                                let stock = 0;
                                let uom = component.uom;
                                snapshot.forEach(d => {
                                    stock += Number(d.data().currentStock) || 0;
                                    if (d.data().uom) uom = d.data().uom;
                                });
                                const requiredQuantity = component.quantity * orderQuantity;
                                const free = stock - (reserved[component.materialId] || 0);
                                if (free < requiredQuantity) {
                                    throw new Error(`Insufficient stock for ${component.materialName}. Required: ${requiredQuantity}, Available (after other pending allocations): ${free}`);
                                }
                                return {
                                    materialId: component.materialId,
                                    materialName: component.materialName,
                                    qtyPerUnit: component.quantity,
                                    requiredQty: requiredQuantity,
                                    uom: normalizeUom(uom)
                                };
                            });
                    });
                    
                    return Promise.all(checks).then(items => {
                        // NOTE: stock is NOT reduced here any more.
                        // Production requests the issue, the Store approves it, and only then stock is reduced.
                        return db.collection('allocations').doc(allocationId).set({
                            allocationId: allocationId,
                            orderId: orderId,
                            bomId: bom.bomId,
                            fgProductId: bom.fgProductId,
                            fgProductName: bom.fgProductName,
                            customer: customer,
                            machine: machine,
                            orderQuantity: orderQuantity,
                            uom: fgUom,
                            components: items,
                            issueFlow: 'store_approval',
                            materialAvailable: false,
                            issueStatus: 'not_requested',
                            status: 'active',
                            allocatedBy: user,
                            allocatedDate: firebase.firestore.FieldValue.serverTimestamp(),
                            remarks: remarks
                        });
                    });
                })
                .then(() => {
                    alert(`Allocated ${orderQuantity} of ${bom.fgProductName} to ${customer} on ${machine}. Production will request the materials from the Store.`);
                    document.getElementById('allocationForm').reset();
                    document.getElementById('materialRequirements').innerHTML = '<p class="text-muted">Select a BOM and enter order quantity to see material requirements</p>';
                    loadDashboardData();
                    showModule('dashboard');
                })
                .catch(error => {
                    console.error('Error allocating stock:', error);
                    alert(`Error: ${error.message}`);
                });
            }).catch(error => {
                console.error('Error finding BOM:', error);
                alert('Error finding BOM. Please try again.');
            });
        }
